<!--
================================================================================
DESIGNER LENS — WHO I CHANNELLED, AND WHY

CHOSEN: Erik Spiekermann / MetaDesign — specifically the transit-and-signage
practice behind the Berlin BVG system, the Deutsche Bahn typographic programme,
and the Düsseldorf Airport wayfinding.

WHY HIM AND NOT THE OTHERS, FOR THIS AUDIENCE AND THIS PROBLEM:

  Vignelli would have given us a beautiful diagram of the program. But Vignelli
  optimises the OVERVIEW — the map you consult before you travel. Our student is
  not consulting an overview; they are mid-journey, one hand on a robot, and the
  only question they have is "which line am I on now, and how much is left".
  That is not map-making. That is SIGNAGE.

  Tufte optimises for density and comparison across a data set. There is no data
  set here — there is one sequence of nine instructions. Density is the enemy;
  a 12-year-old in a noisy hall re-reading a compressed line loses their place.

  Hara/MUJI's restraint is genuinely close, and I have borrowed the discipline of
  subtraction from it. But MUJI restraint is contemplative — it assumes a calm
  user with time. Our user is neither calm nor has time.

  Spiekermann's whole career is the exact problem: a person under time pressure,
  in bad light, at speed, in a noisy public place, needs to know WHERE THEY ARE
  in a structured route and WHAT COMES NEXT — and the type has to survive being
  read badly. He treats legibility as an ethical obligation to the traveller, not
  as taste. Replace "traveller" with "10-year-old at a competition bench" and the
  brief is unchanged. He is also the one designer here who works natively in
  MIXED-LANGUAGE systems (DB signage carries fixed untranslatable station names
  inside translated chrome) — which is precisely our hard constraint that block
  names must stay English inside a Malay or Chinese interface.

HIS PRINCIPLES → MY DECISIONS:

  1. "Signage answers one question at a time."
     → Every screen has exactly one decision on it. The Entry screen is a fork of
       two full-width targets, not a menu. The Ask screen is one field. Nothing
       competes with the primary act.

  2. "A route is understood by position, not by picture."
     → THE HERO: the block program is drawn as a LINE DIAGRAM with stations. A
       continuous rail runs down the left; every block is a station dot on it;
       nesting is drawn as a real branch line that departs the trunk and rejoins
       it. Depth is not indentation-as-whitespace, it is a physically visible
       branch you can trace with a finger. Tapping a station fills it in, and the
       YOU ARE HERE marker walks itself to the next unbuilt station. The counter
       at the top ("BLOCK 4 OF 9") is the platform indicator.

  3. "Type is a service, not decoration. Set it big and set it once."
     → One family, three sizes, three weights, full stop. Block text is 16.5px
       at weight 600 with generous leading — deliberately larger than the UI
       chrome around it, because the block text is the thing being copied by
       hand. Chrome is subordinate to content, always. No text below 12.5px.

  4. "Distinguish what the reader must ACT on from what merely informs."
     → Inline slots (dropdown choices and typed values) are drawn as physical
       fields — a chevron pill for a dropdown, a bordered numeric cell for a
       typed value — because those are the two things a student must go and
       change in the robot's app. Fixed block text is not a field and never
       looks like one.

  5. "Signage never lies to the traveller about the wait."
     → The queue screen states position and a range in seconds, and shows the
       queue as the same rail motif — you are a station on a line too. Honest
       arithmetic, no indeterminate spinner.

  6. "The name of the place does not get translated."
     → Chinese and Malay chrome, English block names, and an explicit standing
       note that says so — turning the constraint into a stated rule rather than
       an apparent bug. This is DB station-name practice, applied literally.

DEGRADED / NOT DONE: no real photo (spec forbids stock imagery — the attachment
is an honest grey plate); typeface is a system grotesque rather than FF Meta.
================================================================================
-->

/*
  ── COLOUR DERIVATION (oklch) ────────────────────────────────────────────────
  Not a palette. Derived from the content's own logic, which contains exactly
  three states and nothing else:

    (a) INSTRUCTION      — everything that must be read. Neutral ink on paper.
    (b) POSITION         — where the student currently is on the path. ONE hue.
    (c) FAILURE          — a block name that did not validate. ONE hue, reserved.

  (b) is ochre/amber oklch(0.72 0.15 78). Chosen because in every physical
  wayfinding system in the world, the "you are here / attend to this now"
  marker is a warm high-luminance signal — it is the brightest thing in the
  field without being an alarm. It is legible in bad light and survives on a
  sun-washed phone screen at arm's length.

  (c) is red oklch(0.55 0.20 27), used for ONE thing and one thing only: an
  invalid block name. If red appeared anywhere else it would stop meaning
  "wrong". Scarcity is what makes it work.

  Large fields are near-zero chroma: paper oklch(0.98 0.006 85) (a warm white,
  because a pure white phone panel at full brightness in a bright hall is
  fatiguing), ink oklch(0.24 0.015 255) (not black — a hair of blue keeps it
  from vibrating against the warm paper).

  ── THE CATEGORY-COLOUR DECISION (deliberate, and a refusal) ─────────────────
  R Block has 8 categories: Control, Motion, Sensing, Variable, Calculation,
  Function, Screen, Sound. Colour-coding them would be the obvious move and it
  is WRONG here, for three reasons:
    1. Eight hues at high chroma is more colour than the "you are here" marker
       can compete with. The single most important signal on the screen would
       lose to decoration. Wayfinding rule: colour is a scarce channel; spend it
       on navigation, not on classification.
    2. The category is not information the student navigates BY — it is a lookup
       key telling them which tab to open in the robot's app. A word does that
       perfectly and unambiguously. A colour requires a legend they must learn.
    3. 8% of boys have colour-vision deficiency, and this is a robotics club.
  So categories are set as TYPE: small, uppercase, letterspaced, monochrome —
  the same way a platform sign names a line without needing to be that colour.
*/
:root{
  --ink:        oklch(0.24 0.015 255);
  --ink-2:      oklch(0.45 0.012 255);
  --ink-3:      oklch(0.60 0.010 255);
  --rule:       oklch(0.88 0.006 255);
  --rule-soft:  oklch(0.93 0.005 255);
  --paper:      oklch(0.985 0.006 85);
  --paper-2:    oklch(0.955 0.008 85);
  --mark:       oklch(0.72 0.15 78);
  --mark-deep:  oklch(0.52 0.12 72);
  --mark-wash:  oklch(0.955 0.045 82);
  --bad:        oklch(0.55 0.20 27);
  --bad-wash:   oklch(0.955 0.035 27);
  --stage:      oklch(0.255 0.014 258);
  --stage-2:    oklch(0.33 0.014 258);
  --stage-tx:   oklch(0.80 0.010 258);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background: var(--stage);
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.stage-head{ padding: 26px 40px 0; max-width: 1520px; }
.kicker{

/* The deck is scaled to present all five phones inside the 1600×1000 frame.
   Scaling, not cropping — a presentation surface has to show the whole route. */

button{ font-family:inherit; }
::-webkit-scrollbar{ width:0; height:0; }

/* ═══════════════════════════════════════════════════════════════
   THE HERO: the block program drawn as a line diagram with stations.
   Nesting is a branch line that departs the trunk and rejoins it —
   a depth you can trace with a finger, not just whitespace.
   ═══════════════════════════════════════════════════════════════ */
const TRUNK_X = 21;      // x of the depth-0 rail, inside the gutter
const BRANCH  = 17;      // horizontal offset per branch level
const DOT_Y   = 25;      // vertical centre of a station dot within a row
const MAXD    = 2;
const GUTTER  = TRUNK_X + BRANCH * MAXD + 22;

function Token({ tok }) {
  if (tok.k === 't') return <span>{tok.v}</span>;
  if (tok.k === 'dd') return (
    <span style={{
      display:'inline-flex', alignItems:'center', gap:5,
      background:'var(--paper-2)', border:'1.5px solid var(--rule)',
      borderRadius:999, padding:'1px 9px 2px 11px', margin:'0 1px',
      fontWeight:700, whiteSpace:'nowrap',
    }}>
      {tok.v}
      <span style={{ fontSize:9, color:'var(--ink-3)', transform:'translateY(1px)' }}>▼</span>
    </span>
  );
  return (
    <span style={{
      display:'inline-block',
      background:'#fff', border:'1.5px solid var(--ink-2)',
      borderRadius:5, padding:'1px 9px 2px', margin:'0 1px',
      fontWeight:700, fontVariantNumeric:'tabular-nums', whiteSpace:'nowrap',
    }}>{tok.v}</span>
  );
}

function Rails({ block, prev, next, state }) {
  // state: 'done' | 'here' | 'todo' | 'bad'
  const d = block.d;
  const pd = prev ? prev.d : -1;
  const nd = next ? next.d : -1;
  const segs = [];

  // trunk + every branch level that is live through this row
  for (let lvl = 0; lvl <= Math.max(d, 0); lvl++) {
    const x = TRUNK_X + lvl * BRANCH;
    const startsHere = lvl === d && pd < d;     // this branch departs at this row
    const endsHere   = lvl === d && nd < d;     // this branch rejoins after this row
    const top    = startsHere ? DOT_Y : 0;
    const bottom = endsHere ? 'auto' : 0;
    segs.push(
      <div key={'v'+lvl} style={{
        position:'absolute', left:x - 1, top,
        ...(endsHere ? { height: DOT_Y - top } : { bottom: 0 }),
        width:2,
        background: lvl < d || state === 'done' ? 'var(--rule)' : 'var(--rule)',
      }} />
    );
  }
  // elbow: the branch physically departs the parent rail
  if (d > 0 && pd < d) {
    segs.push(
      <div key="elbow" style={{
        position:'absolute', left: TRUNK_X + (d-1)*BRANCH - 1, top: DOT_Y - 1,
        width: BRANCH, height:2, background:'var(--rule)',
      }} />
    );
  }
  // rejoin elbow
  if (d > 0 && nd < d) {
    segs.push(
      <div key="rejoin" style={{
        position:'absolute', left: TRUNK_X + (d-1)*BRANCH - 1, top: DOT_Y - 1,
        width: BRANCH, height:2, background:'var(--rule)',
      }} />
    );
  }

  const x = TRUNK_X + d * BRANCH;
  const dotStyle =
    state === 'bad'  ? { background:'var(--bad)',  border:'2px solid var(--bad)',  w:14 } :
    state === 'done' ? { background:'var(--ink)',  border:'2px solid var(--ink)',  w:14 } :
    state === 'here' ? { background:'var(--mark)', border:'3px solid var(--mark-deep)', w:20 } :
                       { background:'var(--paper)',border:'2px solid var(--ink-3)', w:14 };

  return (
    <div style={{ position:'relative', width:GUTTER, flex:'0 0 auto', alignSelf:'stretch' }}>
      {segs}
      <div style={{
        position:'absolute', left: x - dotStyle.w/2, top: DOT_Y - dotStyle.w/2,
        width:dotStyle.w, height:dotStyle.w, borderRadius:999,
        background:dotStyle.background, border:dotStyle.border, boxSizing:'border-box',
        display:'flex', alignItems:'center', justifyContent:'center',
      }}>
        {state === 'done' && (
          <svg width="8" height="7" viewBox="0 0 8 7"><path d="M1 3.6L3 5.6L7 1.2" stroke="#fff" strokeWidth="1.8" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>
        )}
        {state === 'bad' && (
          <span style={{ color:'#fff', fontSize:10, fontWeight:800, lineHeight:1 }}>!</span>
        )}
      </div>
    </div>
  );
}

function BlockLine({ block, prev, next, done, isHere, onToggle, tx }) {
  const state = block.bad ? 'bad' : done ? 'done' : isHere ? 'here' : 'todo';
  return (
    <div
      onClick={block.bad ? undefined : onToggle}
      data-block-line={block.id}
      role="button"
      style={{
        display:'flex', alignItems:'stretch', cursor: block.bad ? 'default' : 'pointer',
        background: state === 'here' ? 'var(--mark-wash)' : state === 'bad' ? 'var(--bad-wash)' : 'transparent',
        borderTop:'1px solid var(--rule-soft)',
        WebkitTapHighlightColor:'transparent', userSelect:'none',
        transition:'background .12s',
      }}
    >
      <Rails block={block} prev={prev} next={next} state={state} />
      <div style={{ flex:1, padding:'11px 16px 15px 0', minWidth:0 }}>
        <div style={{
          display:'flex', alignItems:'center', gap:8, marginBottom:4, height:15,
        }}>
          <span style={{
            fontSize:10.5, fontWeight:800, letterSpacing:'.13em', textTransform:'uppercase',
            color: state==='bad' ? 'var(--bad)' : state==='done' ? 'var(--ink-3)' : 'var(--ink-2)',
          }}>{block.cat}</span>
          {state === 'here' && (
            <span style={{
              fontSize:9.5, fontWeight:800, letterSpacing:'.13em',
              color:'var(--mark-deep)', border:'1.5px solid var(--mark-deep)',
              borderRadius:3, padding:'1px 5px',
            }}>{tx.hereLabel}</span>
          )}
          {block.added && (
            <span style={{
              fontSize:9.5, fontWeight:800, letterSpacing:'.1em',
              color:'#fff', background:'var(--ink)', borderRadius:3, padding:'2px 5px',
            }}>ADD THIS</span>
          )}
        </div>
        <div style={{
          fontSize:16.5, lineHeight:'26px', fontWeight:600, letterSpacing:'-.005em',
          color: state==='bad' ? 'var(--bad)' : state==='done' ? 'var(--ink-3)' : 'var(--ink)',
          ...(state==='bad' ? {
            border:'2px solid var(--bad)', borderRadius:8, padding:'6px 10px', background:'#fff',
          } : {}),
        }}>
          {block.tk.map((tok,i)=><Token key={i} tok={tok} />)}
        </div>
        {block.bad && (
          <div style={{ marginTop:8 }}>
            <div style={{
              fontSize:11, fontWeight:800, letterSpacing:'.1em', textTransform:'uppercase',
              color:'var(--bad)', marginBottom:3,
            }}>{tx.invalid}</div>
            <div style={{ fontSize:13.5, lineHeight:'19px', color:'var(--ink-2)' }}>{block.badWhy}</div>
          </div>
        )}
      </div>
    </div>
  );
}

function BlockProgram({ blocks, doneSet, toggle, tx, lang }) {
  const firstTodo = blocks.find(b => !b.bad && !doneSet.has(b.id));
  const placeable = blocks.filter(b => !b.bad);
  const nDone = placeable.filter(b => doneSet.has(b.id)).length;
  const idx = firstTodo ? placeable.indexOf(firstTodo) + 1 : placeable.length;

  return (
    <div>
      {/* PLATFORM INDICATOR — position on the route, always visible */}
      <div style={{
        position:'sticky', top:0, zIndex:5,
        background:'var(--paper)', borderBottom:'2px solid var(--ink)',
        padding:'11px 18px 10px',
      }}>
        <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', marginBottom:8 }}>
          <div style={{ fontSize:12.5, fontWeight:800, letterSpacing:'.14em', color:'var(--ink)' }}>
            {lang==='zh'
              ? <span>{tx.progress} {idx} {tx.of} {placeable.length}</span>
              : <span>{tx.progress} {idx} {tx.of} {placeable.length}</span>}
          </div>
          <div style={{ fontSize:12.5, fontWeight:600, color:'var(--ink-2)' }}>
            {nDone}/{placeable.length} {tx.done}
          </div>
        </div>
        <div style={{ display:'flex', gap:3 }}>
          {placeable.map(b => {
            const isD = doneSet.has(b.id);
            const isH = firstTodo && b.id === firstTodo.id;
            return <div key={b.id} style={{
              flex:1, height:6, borderRadius:2,
              background: isD ? 'var(--ink)' : isH ? 'var(--mark)' : 'var(--rule)',
            }} />;
          })}
        </div>
      </div>

      <div style={{ background:'var(--paper)' }}>
        {blocks.map((b,i)=>(
          <BlockLine
            key={b.id} block={b} prev={blocks[i-1]} next={blocks[i+1]}
            done={doneSet.has(b.id)}
            isHere={!!firstTodo && firstTodo.id === b.id}
            onToggle={()=>toggle(b.id)}
            tx={tx}
          />
        ))}
        <div style={{ borderTop:'1px solid var(--rule-soft)', padding:'14px 18px 18px', paddingLeft:GUTTER }}>
          <div style={{ fontSize:13.5, lineHeight:'19px', color:'var(--ink-2)' }}>
            {nDone === placeable.length ? tx.allDone : tx.tapHint}
          </div>
        </div>
      </div>
    </div>
  );
}

        </div>
        <div style={{ fontSize:16, lineHeight:'24px', color:'#fff', fontWeight:500 }}>
          {lang==='zh' && '循环里没有把轮子速度重新设为 0，所以机器人碰到墙之后还会继续转。'}
          {lang==='ms' && 'Kelajuan roda tidak pernah ditetapkan semula kepada 0 di dalam gelung, jadi robot terus berpusing selepas terkena dinding.'}
          {lang==='en' && 'The wheel speed is never reset to 0 inside the loop, so the robot keeps turning after it meets the wall.'}
        </div>
      </div>

      <Region label={tx.summary}>
        <div style={{ fontSize:16, lineHeight:'24px', color:'var(--ink)', fontWeight:500 }}>
          {lang==='zh' && '在 If 里加一块把两个轮子停下的 Motion 积木，并删掉那块不存在的积木。'}
          {lang==='ms' && 'Tambah satu blok Motion yang menghentikan kedua-dua roda di dalam If, dan buang blok yang tidak wujud.'}
          {lang==='en' && 'Add one Motion block that stops both wheels inside the If, and delete the block that does not exist.'}
        </div>
      </Region>

      <div style={{ padding:'13px 18px 11px', borderBottom:'1px solid var(--rule)' }}>
        <div style={{ fontSize:11, fontWeight:800, letterSpacing:'.16em', textTransform:'uppercase', color:'var(--ink-3)' }}>{tx.blocks}</div>
      </div>

      <BlockProgram blocks={DEBUG_BLOCKS} doneSet={doneSet} toggle={toggle} tx={tx} lang={lang} />

      <EnglishRule tx={tx} />
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════ */
