<title>R Block Coding Buddy — Approved direction v2</title>

<!--
================================================================================
APPROVED DIRECTION v2 — refinement of benchmark-transfer.html
(Kitchen Stories, Apple Design Award 2017 — verified winner)

WHAT IS UNCHANGED (the approved design language)
  - Warm near-white paper field, chroma <= 0.012 on all large surfaces.
  - Light display typography, generous whitespace, hairlines not boxes.
  - The sticky "N / M placed" transcribe-mode counter that never scrolls away.
  - One unmistakable NEXT UP target.
  - The Build/Debug commitment fork on entry.
  - Inline slots living inside the block itself — never in a legend elsewhere.

WHAT CHANGED IN v2
  1. The block panel is rebuilt in R Block's own visual grammar: solid rounded
     blocks, stacked with no gaps and a puzzle tab between them; C-shaped
     wrappers (Forever, Repeat, if/then) that physically ENCLOSE their contents
     with a left spine and a bottom arm; if / else as labels on that spine;
     dropdown pills with a chevron; oval value slots; hexagonal condition
     blocks seated in the if-block's condition socket. Nesting is now shown by
     CONTAINMENT, not by indenting text rows.
  2. Category hues carry R Block's own identity (Control periwinkle, Variable
     orange, Sensing purple) retuned in oklch to sit inside the paper palette.
  3. Every block name and every default value is taken from
     vendor/r-block-directory.md. Nothing is invented.
================================================================================
-->

<style>
  /* ==========================================================================
     COLOUR
     --------------------------------------------------------------------------
     Field logic is inherited unchanged from the approved direction: a warm,
     near-white paper surface so that content, not chrome, owns the eye.

     CATEGORY HUES — identity kept, volume lowered.
     R Block's own tabs are read straight off the app: Control = periwinkle
     blue, Variable = orange, Sensing = purple. Those three are non-negotiable
     because the student is looking at the real app while they read this.
     Motion / Calculation / Function / Screen / Sound were chosen to fan out
     evenly around the remaining wheel with no pair inside 30 degrees. All
     eight are then forced onto one ramp — fill oklch(L .80 / C .105), ink
     oklch(L .29 / C .075) — so the panel reads as one family of blocks in one
     material rather than eight competing brands.

     THE AMBER / ORANGE COLLISION — solved by removing colour from the contest.
     -------------------------------------------------------------------------
     The approved design gives ember amber to the student's POSITION. R Block
     gives orange to the Variable category. Two warm hues cannot arbitrate that
     at arm's length in bad light, so position is not asked to win a hue
     contest at all. It is moved onto three channels no block can occupy:

       (a) PLACE — position lives in a 34px gutter OUTSIDE the block column.
           No block is ever drawn there. Amber inside the column does not
           exist; orange inside the gutter does not exist.
       (b) FORM — position is a solid pointing TRIANGLE and a 2px rail. Every
           block is a rounded rectangle, pill, oval or hexagon. Nothing else
           on the screen is a triangle.
       (c) WEIGHT — the next-up block additionally carries a 2.5px near-black
           ink ring, the only near-black outline in the product. Ink is a
           value channel, not a hue channel, so it survives even if a student
           is colour-blind or the screen is washed out by hall lighting.

     Variable's orange is further pushed to hue 68 at fill lightness .80, while
     position amber stays the saturated oklch(.64 .155 52). Different hue,
     different lightness, different place, different shape.

     Validation red oklch(0.53 0.21 25) remains unique to a rejected block
     name: no category hue is within 40 degrees of it, and no block fill is
     that dark or that chromatic.
     ========================================================================== */
  :root {
    --paper: oklch(0.968 0.006 78);
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 700px at 18% -8%, oklch(0.995 0.006 82) 0%, transparent 62%),
      radial-gradient(900px 600px at 92% 4%, oklch(0.975 0.016 58) 0%, transparent 58%),
      var(--paper);
    color: oklch(0.245 0.015 60);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
  }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>

    h,

    dim:  `oklch(0.918 0.030 ${h})`,
    edge: `oklch(0.700 0.115 ${h})`,

    slot: `oklch(0.955 0.020 ${h})`,
    slotEdge: `oklch(0.640 0.070 ${h})`,
  };
}

/* Flatten a tree into reading order, skipping rejected blocks. */
function flatten(nodes, out) {
  out = out || [];
  nodes.forEach(n => {
    if (n.bad) return;
    out.push(n.id);
    if (n.cond) out.push(n.cond.id);
    if (n.body) flatten(n.body, out);
    if (n.elseBody) flatten(n.elseBody, out);
  });
  return out;
}

/* ============================================================================
   BLOCK PRIMITIVES — R Block's visual grammar
   ========================================================================== */

/* Dropdown slot: light rounded-rect pill with a chevron, sitting in the block */
function Pill({ v, c, dim }) {
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 4,
      background: dim ? 'oklch(0.975 0.003 80)' : c.slot,
      border: `1px solid ${dim ? C.hairSoft : c.slotEdge}`,
      color: dim ? C.inkSoft : c.ink,
      padding: '1px 6px 2px 7px', borderRadius: 6,
      fontSize: 14, fontWeight: 600, lineHeight: 1.35, whiteSpace: 'nowrap',
    }}>
      {v}
      <svg width="8" height="5" viewBox="0 0 8 5" style={{ opacity: 0.75, flexShrink: 0 }}>
        <path d="M0.7 0.8 L4 4 L7.3 0.8" fill="none" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" />
      </svg>
    </span>
  );
}

/* Value slot: white oval with a thin border */
function Oval({ v, c, dim }) {
  return (
    <span style={{
      display: 'inline-block',
      background: dim ? 'transparent' : '#fff',
      border: `1.5px solid ${dim ? C.hairSoft : c.slotEdge}`,
      color: dim ? C.inkSoft : c.ink,
      padding: '0px 9px 1px 9px', borderRadius: 999,
      fontSize: 14, fontWeight: 700, lineHeight: 1.4, whiteSpace: 'nowrap',
      fontVariantNumeric: 'tabular-nums',
    }}>{v}</span>
  );
}

/* The if-block's blue configuration gear */
function Gear({ c }) {
  return (
    <svg width="14" height="14" viewBox="0 0 24 24" style={{ flexShrink: 0 }}
         fill="none" stroke={c.ink} strokeWidth="2">
      <circle cx="12" cy="12" r="3.2" />
      <path d="M12 2.6v3M12 18.4v3M2.6 12h3M18.4 12h3M5.4 5.4l2.1 2.1M16.5 16.5l2.1 2.1M18.6 5.4l-2.1 2.1M7.5 16.5l-2.1 2.1" strokeLinecap="round" />
    </svg>
  );
}

/* Block content: fixed text plus inline slots, in reading order */
function Parts({ p, c, dim, cond }) {
  return p.map((seg, k) => {
    const [kind, val] = seg;
    if (kind === 'g') return <Gear key={k} c={c} />;
    if (kind === 'cond') return <React.Fragment key={k}>{cond}</React.Fragment>;
    if (kind === 'd') return <Pill key={k} v={val} c={c} dim={dim} />;
    if (kind === 'v') return <Oval key={k} v={val} c={c} dim={dim} />;
    return <span key={k} style={{
      color: dim ? C.inkSoft : c.ink, fontSize: 14, fontWeight: 600, lineHeight: 1.4,
      letterSpacing: -0.1,
    }}>{val}</span>;
  });
}

function CatTag({ name, c, dim }) {
  return (
    <span style={{
      fontSize: 12, fontWeight: 700, letterSpacing: 0.6, textTransform: 'uppercase',
      color: dim ? C.inkFaint : c.ink, opacity: dim ? 1 : 0.55,
      marginLeft: 'auto', paddingLeft: 6, flexShrink: 0, lineHeight: 1.4,
    }}>{name}</span>
  );
}

/* Hexagonal boolean block — pointed both ends, seated in the if socket */
function Hex({ node, done, next, onTap, register, lang }) {
  const c = CAT[node.cat];
  const dim = done;
  /* clip-path would swallow a box-shadow, so the near-black NEXT ring is drawn
     as a second clipped layer behind the hexagon — the position marker must
     survive on condition blocks too. */
  const hex = 'polygon(9px 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 9px 100%, 0 50%)';
  return (
    <span
      ref={el => register(node.id, el)}
      data-block={node.id}
      onClick={(e) => { e.stopPropagation(); onTap(node.id); }}
      style={{
        display: 'inline-block', maxWidth: '100%', minWidth: 0,
        clipPath: hex, background: next ? C.ink : 'transparent',
        padding: next ? 3 : 0, cursor: 'pointer', userSelect: 'none',
        fontSize: 0, lineHeight: 0, verticalAlign: 'middle',
      }}>
      <span style={{
        display: 'inline-flex', flexWrap: 'wrap', alignItems: 'center', gap: 5,
        background: dim ? c.dim : c.fill, clipPath: hex,
        padding: '5px 15px 6px 15px', maxWidth: '100%',
      }}>
        <Parts p={node.p} c={c} dim={dim} />

/* C-shaped wrapper: left spine + bottom arm physically enclose the body.
   Nesting is containment, not indentation. */
function CBlock({ node, ctx }) {
  const c = CAT[node.cat];
  const dim = ctx.done.has(node.id);
  const next = ctx.next === node.id;
  const hasElse = !!node.elseBody;
  const condEl = node.cond
    ? <Hex node={node.cond} done={ctx.done.has(node.cond.id)} next={ctx.next === node.cond.id}
           onTap={ctx.onTap} register={ctx.register} lang={ctx.lang} />
    : null;

  const arm = (label) => (
    <div style={{
      padding: '6px 11px 6px 11px', display: 'flex', alignItems: 'center',
      fontSize: 14, fontWeight: 700, color: dim ? C.inkSoft : c.ink, letterSpacing: -0.1,
    }}>{label}</div>
  );

  return (
    <div style={{ position: 'relative', marginBottom: 2 }}>
      <div style={{
        background: dim ? c.dim : c.fill, borderRadius: 10,
        paddingBottom: 11, position: 'relative', zIndex: 2,
      }}>
        <div
          ref={el => ctx.register(node.id, el)}
          data-block={node.id}
          onClick={() => ctx.onTap(node.id)}
          style={{
            padding: '6px 11px 7px 11px', borderRadius: 10,
            display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: 5,
            cursor: 'pointer', userSelect: 'none',
            boxShadow: next ? `0 0 0 2.5px ${C.ink}, 0 6px 18px oklch(0.640 0.155 52 / 0.22)` : 'none',
          }}>
          <Parts p={node.p} c={c} dim={dim} cond={condEl} />
          <CatTag name={node.cat} c={c} dim={dim} />
        </div>

        {/* mouth 1 */}
        <div style={{ marginLeft: 13, background: ctx.bg, padding: '2px 0 2px 4px' }}>
          <Nodes list={node.body || []} ctx={ctx} />
        </div>

        {hasElse && <div style={{ paddingLeft: 0 }}>{arm('else')}</div>}
        {hasElse && (
          <div style={{ marginLeft: 13, background: ctx.bg, padding: '2px 0 2px 4px' }}>
            <Nodes list={node.elseBody} ctx={ctx} />
          </div>
        )}
      </div>
      <div style={{
        position: 'absolute', left: 16, bottom: -3, width: 15, height: 5,
        background: dim ? c.dim : c.fill, borderRadius: '0 0 4px 4px', zIndex: 1,
      }} />
    </div>
  );
}

function Nodes({ list, ctx }) {
  return list.map(n => {
    if (n.bad) return <BadBlock key={n.id} node={n} lang={ctx.lang} t={ctx.t} />;
    if (n.c || n.ifBlock) return <CBlock key={n.id} node={n} ctx={ctx} />;
    return (
      <div key={n.id} style={{ marginBottom: 2 }}>
        <Stmt node={n} done={ctx.done.has(n.id)} next={ctx.next === n.id}
              onTap={ctx.onTap} register={ctx.register} />
      </div>
    );
  });
}

/* ---------------------------------------------------------------------------
   BlockPanel — THE HERO.
   The block column is pure R Block. The student's POSITION lives entirely in
   the 34px gutter to its left: an amber rail filled behind them, a solid amber
   TRIANGLE at the next block, hollow rings ahead. Nothing amber, and nothing
   triangular, ever appears inside the block column — that is what keeps
   position from colliding with the orange Variable category.
   ------------------------------------------------------------------------- */
function BlockPanel({ tree, done, onTap, next, lang, t, bg }) {
  const wrapRef = useRef(null);
  const rowRefs = useRef({});
  const [marks, setMarks] = useState([]);
  const order = useMemo(() => flatten(tree), [tree]);
  const register = (id, el) => { rowRefs.current[id] = el; };

  useLayoutEffect(() => {
    const w = wrapRef.current;
    if (!w) return;
    const wr = w.getBoundingClientRect();
    const m = [];
    order.forEach(id => {
      const el = rowRefs.current[id];
      if (!el) return;
      const r = el.getBoundingClientRect();
      m.push({ id, y: Math.round(r.top - wr.top + Math.min(r.height, 34) / 2) });
    });
    const a = JSON.stringify(m), b = JSON.stringify(marks);
    if (a !== b) setMarks(m);
  });

  const nextMark = marks.find(m => m.id === next);
  const first = marks[0], last = marks[marks.length - 1];
  const railTop = first ? first.y : 0;
  const railBot = last ? last.y : 0;
  const fillTo = nextMark ? nextMark.y : railBot;

  return (
    <div ref={wrapRef} style={{ position: 'relative', padding: '2px 14px 2px 34px' }}>

      {/* ---- POSITION GUTTER (outside the block column) ---- */}
      {marks.length > 0 && (
        <div style={{ position: 'absolute', left: 0, top: 0, width: 34, height: '100%', pointerEvents: 'none' }}>
          <div style={{ position: 'absolute', left: 15, top: railTop, height: Math.max(0, railBot - railTop), width: 2, background: C.hair, borderRadius: 2 }} />
          <div style={{ position: 'absolute', left: 15, top: railTop, height: Math.max(0, fillTo - railTop), width: 2, background: C.accent, borderRadius: 2 }} />
          {marks.map(m => {
            const isDone = done.has(m.id);
            const isNext = m.id === next;
            if (isNext) {
              return (
                <div key={m.id} style={{ position: 'absolute', left: 6, top: m.y - 9 }}>
                  <svg width="20" height="18" viewBox="0 0 20 18">
                    <path d="M3 1.6 L17 9 L3 16.4 Z" fill={C.accent} stroke={C.accent} strokeWidth="2.4" strokeLinejoin="round" />
                  </svg>
                </div>
              );
            }
            if (isDone) {
              return (
                <div key={m.id} style={{
                  position: 'absolute', left: 9, top: m.y - 7, width: 14, height: 14,
                  borderRadius: 999, background: C.accent,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}>
                  <svg width="9" height="9" viewBox="0 0 10 10">
                    <path d="M1.6 5.2 L3.9 7.4 L8.4 2.6" stroke="#fff" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" />
                  </svg>
                </div>
              );
            }
            return (
              <div key={m.id} style={{
                position: 'absolute', left: 11, top: m.y - 5, width: 10, height: 10,
                borderRadius: 999, background: C.card, border: `2px solid ${C.hair}`,
              }} />
            );
          })}
          {nextMark && (
            <div style={{
              position: 'absolute', left: 0, top: nextMark.y - 26, width: 34,
              fontSize: 12, fontWeight: 800, letterSpacing: 0.4, color: C.accentDeep,
              textAlign: 'center', textTransform: 'uppercase',
            }}>{lang === 'zh' ? '这' : 'now'}</div>
          )}
        </div>
      )}

      <Nodes list={tree} ctx={{ done, onTap, next, register, lang, t, bg }} />
    </div>
  );
}

              <div style={{ fontSize: 62, fontWeight: 200, letterSpacing: -3, color: C.accent, lineHeight: 0.9, fontVariantNumeric: 'tabular-nums' }}>2</div>
              <div style={{ fontSize: 12, color: C.inkSoft, marginTop: 6 }}>{t.position}</div>
            </div>
            <div style={{ flex: 1, paddingBottom: 6 }}>
              <div style={{ display: 'flex', gap: 5, marginBottom: 8 }}>
                {[0, 1, 2, 3, 4].map(i => (
                  <div key={i} style={{
                    flex: 1, height: 30, borderRadius: 7,
                    background: i < 1 ? C.accent : (i === 1 ? C.accentEdge : 'oklch(0.945 0.005 74)'),
                  }} />
                ))}
              </div>
              <div style={{ fontSize: 12, color: C.inkSoft }}>1 {t.ahead}</div>
            </div>
          </div>

          <div style={{ height: 1, background: C.hairSoft, margin: '18px -18px 16px -18px' }} />

          <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
            <span style={{ fontSize: 13, color: C.inkSoft }}>{t.est}</span>
            <span style={{ flex: 1 }} />
            <span style={{ fontSize: 30, fontWeight: 250, letterSpacing: -1, color: C.ink, fontVariantNumeric: 'tabular-nums', lineHeight: 1 }}>18–26</span>
            <span style={{ fontSize: 14, color: C.inkSoft }}>s</span>
          </div>
        </div>

        <div style={{ marginTop: 24 }}>
          {t.stages.map((s, i) => {
            const isDone = i < stage;
            const isNow = i === stage;
            return (
              <div key={i} data-stage={i} onClick={() => setStage(i)} style={{ display: 'flex', gap: 12, cursor: 'pointer' }}>
                <div style={{ width: 20, position: 'relative', flexShrink: 0 }}>
                  {i < t.stages.length - 1 && (
                    <div style={{ position: 'absolute', left: 9, top: 18, bottom: -4, width: 2, background: isDone ? C.accent : C.hair }} />
                  )}
                  <div style={{
                    width: 20, height: 20, borderRadius: 999, marginTop: 4, position: 'relative', zIndex: 2,
                    background: isDone ? C.accent : C.card,
                    border: `2px solid ${isDone || isNow ? C.accent : C.hair}`,
                    boxShadow: isNow ? `0 0 0 5px ${C.accentWash}` : 'none',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                  }}>
                    {isDone && (
                      <svg width="10" height="10" viewBox="0 0 10 10">
                        <path d="M1.6 5.2 L3.9 7.4 L8.4 2.6" stroke="#fff" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round" />
                      </svg>
                    )}
                    {isNow && <div style={{ width: 7, height: 7, borderRadius: 999, background: C.accent }} />}
                  </div>
                </div>
                <div style={{ paddingBottom: 18, flex: 1 }}>
                  <div style={{
                    fontSize: 15, lineHeight: 1.35, marginTop: 4,
                    color: isNow ? C.ink : (isDone ? C.inkMid : C.inkFaint),
                    fontWeight: isNow ? 650 : 450,
                  }}>{s}</div>
                  {isNow && <div style={{ fontSize: 12, color: C.accentDeep, marginTop: 3 }}>···</div>}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div style={{ padding: '0 18px 22px 18px' }}>
        <div style={{
          background: 'oklch(0.972 0.006 80)', border: `1px solid ${C.hairSoft}`,
          borderRadius: 12, padding: '12px 14px', fontSize: 14, color: C.inkMid, lineHeight: 1.5,
        }}>{t.keep}</div>
      </div>
    </div>
  );
}

/* ============================================================================
   SCREEN 4 — Answer, Build. The block panel is the hero.
   ========================================================================== */
function ScreenBuild() {
  const [lang, setLang] = useState('en');
  const [done, setDone] = useState(new Set(['v1', 'f1', 'i1']));
  const t = T[lang];
  const order = useMemo(() => flatten(BUILD_TREE), []);
  const toggle = (id) => setDone(prev => {
    const n = new Set(prev);
    n.has(id) ? n.delete(id) : n.add(id);
    return n;
  });
  const next = useMemo(() => order.find(id => !done.has(id)) || null, [done, order]);

  const summary = {
    en: 'Drive forward while IR sensor No.1 sees the line; rotate back when it does not.',
    ms: 'Gerak ke hadapan selagi sensor IR No.1 nampak garisan; pusing balik jika tidak.',
    zh: '一直循环：No.1 红外传感器看得到线就前进，丢线就转回线上并记一次。',
  }[lang];
  const note = {
    en: '200 is R Block’s default threshold — lower it on a shiny floor.',
    ms: '200 ialah ambang lalai R Block — turunkan di lantai berkilat.',
    zh: '200 是 R Block 的默认阈值 —— 地面反光时调低。',
  }[lang];

  return (
    <div style={{ background: C.card, minHeight: '100%' }}>
      <div style={{ padding: '10px 16px 6px 16px', display: 'flex', alignItems: 'center', gap: 10 }}>
        <span style={{
          fontSize: 12, fontWeight: 800, letterSpacing: 0.8, textTransform: 'uppercase',
          color: C.accentDeep, background: C.accentWash, padding: '3px 9px', borderRadius: 6,
        }}>{t.build}</span>
        <span style={{ flex: 1 }} />
        <LangPicker lang={lang} setLang={setLang} />
      </div>

      <div style={{ padding: '0 16px 7px 16px' }}>
        <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 1.1, textTransform: 'uppercase', color: C.inkSoft, marginBottom: 2 }}>{t.summary}</div>
        <div style={{ fontSize: 14.5, lineHeight: 1.42, color: C.ink }}>{summary}</div>
      </div>

      <ProgressHeader label={t.program} doneCount={done.size} total={order.length} lang={lang} hint={t.tapHint} />
      <div style={{ height: 6 }} />

      <BlockPanel tree={BUILD_TREE} done={done} onTap={toggle} next={next} lang={lang} t={t} bg={C.card} />

      <div style={{ padding: '8px 16px 18px 16px' }}>
        {!next && (
          <div style={{
            background: C.doneWash, border: `1px solid oklch(0.870 0.045 155)`, borderRadius: 12,
            padding: '10px 13px', fontSize: 14, fontWeight: 650, color: C.done, marginBottom: 10,
          }}>✓ {t.allDone}</div>
        )}
        <div style={{ display: 'flex', gap: 8, alignItems: 'flex-start' }}>
          <div style={{ fontSize: 12, fontWeight: 800, letterSpacing: 0.9, textTransform: 'uppercase', color: C.inkFaint, marginTop: 2, flexShrink: 0 }}>{t.note}</div>
          <div style={{ fontSize: 14, color: C.inkMid, lineHeight: 1.45 }}>{note}</div>
        </div>
        <div style={{ marginTop: 9, borderTop: `1px solid ${C.hairSoft}`, paddingTop: 8 }}>
          <EngNote text={t.engNote} />
        </div>
      </div>
    </div>
  );
}

/* ============================================================================
   SCREEN 5 — Answer, Debug. Bahasa Malaysia interface, English block names,
   the "what was wrong" region, and one rejected block name in red — fully
   expanded, never clipped.
   ========================================================================== */
function ScreenDebug() {
  const [lang, setLang] = useState('ms');
  const [done, setDone] = useState(new Set(['r1']));
  const t = T[lang];
  const order = useMemo(() => flatten(DEBUG_TREE), []);
  const toggle = (id) => setDone(prev => {
    const n = new Set(prev);
    n.has(id) ? n.delete(id) : n.add(id);
    return n;
  });
  const next = useMemo(() => order.find(id => !done.has(id)) || null, [done, order]);

  const wrong = {
    en: 'The sensor test sat outside Repeat, so it ran once and never again.',
    ms: 'Ujian sensor berada di luar Repeat — ia berjalan sekali sahaja.',
    zh: '传感器判断写在 Repeat 外面，只跑了一次。',
  }[lang];
  const fix = {
    en: 'Move the if-block inside Repeat so the sensor is re-read every pass.',
    ms: 'Pindahkan blok if ke dalam Repeat.',
    zh: '把 if 积木移到 Repeat 里面，让传感器每轮都重新读取。',
  }[lang];

  return (
    <div style={{ background: C.card, minHeight: '100%' }}>
      <div style={{ padding: '10px 16px 6px 16px', display: 'flex', alignItems: 'center', gap: 10 }}>
        <span style={{
          fontSize: 12, fontWeight: 800, letterSpacing: 0.8, textTransform: 'uppercase',
          color: C.danger, background: C.dangerWash, padding: '3px 9px', borderRadius: 6,
        }}>{t.debug}</span>
        <span style={{ flex: 1 }} />
        <LangPicker lang={lang} setLang={setLang} />
      </div>

      <div style={{ padding: '0 16px 8px 16px' }}>
        <div style={{
          background: C.dangerWash, border: `1px solid ${C.dangerEdge}`, borderRadius: 13,
          padding: '7px 12px 8px 12px',
        }}>
          <div style={{ fontSize: 14, lineHeight: 1.42, color: 'oklch(0.330 0.075 30)' }}>
            <span style={{ fontSize: 12, fontWeight: 800, letterSpacing: 0.8, textTransform: 'uppercase', color: C.danger, marginRight: 7 }}>{t.wrong}</span>
            {wrong}
          </div>
          <div style={{ height: 1, background: C.dangerEdge, margin: '7px -12px 6px -12px' }} />
          <div style={{ fontSize: 14, lineHeight: 1.42, color: C.ink, fontWeight: 600 }}>{fix}</div>
        </div>
      </div>

      <ProgressHeader label={t.program} doneCount={done.size} total={order.length} lang={lang} hint={t.tapHint} />
      <div style={{ height: 4 }} />

      <BlockPanel tree={DEBUG_TREE} done={done} onTap={toggle} next={next} lang={lang} t={t} bg={C.card} />

      <div style={{ padding: '12px 16px 24px 16px', borderTop: `1px solid ${C.hairSoft}`, marginTop: 10 }}>
        <EngNote text={t.engNote} />
      </div>
    </div>
  );
}

/* ============================================================================
   Presentation surface
   ========================================================================== */
/* All five phones are shown at once on one presentation surface. The device is
   still a true 393x852 iPhone — the whole tile is optically scaled so that the
   full set fits a 1600x1100 sheet without any screen being cut off. */
const S = 0.70;
const FRAME_W = 393 + 24, FRAME_H = 852 + 24;

function Phone({ caption, children, battery = 78, time = '9:41' }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', width: Math.round(FRAME_W * S) }}>
      <div style={{
        fontStyle: 'italic', fontSize: 13.5, color: 'oklch(0.420 0.020 62)',
        marginBottom: 10, textAlign: 'center', lineHeight: 1.35, minHeight: 54,
      }}>{caption}</div>
      <div style={{ width: FRAME_W * S, height: FRAME_H * S }}>
        <div style={{ transform: `scale(${S})`, transformOrigin: 'top left', width: FRAME_W, height: FRAME_H }}>
          <IosFrame time={time} battery={battery}>{children}</IosFrame>
        </div>
      </div>
    </div>
  );
}

function App() {
  return (
    <div style={{
      padding: '30px 20px 34px 20px', minHeight: '100vh',
      display: 'flex', flexDirection: 'column', justifyContent: 'center',
    }}>
      <div style={{ maxWidth: 1520, margin: '0 auto 22px auto', display: 'flex', alignItems: 'flex-end', gap: 48, width: '100%' }}>
        <div style={{ flexShrink: 0 }}>
        <div style={{
          fontSize: 11.5, fontWeight: 800, letterSpacing: 2.4, textTransform: 'uppercase',
          color: 'oklch(0.470 0.135 48)',
        }}>Approved direction v2 · Kitchen Stories transfer, R Block grammar</div>
        <div style={{
          fontSize: 44, fontWeight: 250, letterSpacing: -1.5, marginTop: 8,
          color: 'oklch(0.245 0.015 60)', lineHeight: 1.05,
        }}>R Block Coding Buddy</div>
        </div>
        <div style={{
          fontSize: 15, color: 'oklch(0.455 0.014 60)',
          maxWidth: 700, lineHeight: 1.5, paddingBottom: 4,
        }}>
          Kitchen Stories' cooking mode — a step counter that never scrolls away and every
          ingredient repeated inside the step that needs it — becomes a <strong style={{ fontWeight: 650 }}>transcribe
          mode</strong>. The blocks are now drawn in R Block's own grammar: C-shaped wrappers that
          enclose what they loop over, dropdown pills, oval values and hexagonal conditions, so
          transcription becomes recognition. The student's position never enters that colour
          contest — it lives in the amber gutter to the left, as a triangle no block can imitate.
        </div>
      </div>
      <div style={{ height: 1, background: 'oklch(0.885 0.010 74)', maxWidth: 1520, margin: '0 auto 20px auto', width: '100%' }} />

      <div style={{
        display: 'flex', flexWrap: 'wrap', gap: 14, justifyContent: 'center',
        maxWidth: 1560, margin: '0 auto', alignItems: 'flex-end',
      }}>
        <Phone caption="1 · Entry — the fork, not a menu. Tap Build/Debug, tap a language." time="9:41" battery={78}>
          <ScreenEntry />
        </Phone>
        <Phone caption="2 · Ask — shown in the photo-attached state. Tap Remove for the empty state." time="9:42" battery={77}>
          <ScreenAsk />
        </Phone>
        <Phone caption="3 · Working — queue position and an honest range, in 中文. Tap a stage." time="9:42" battery={77}>
          <ScreenQueue />
        </Phone>
        <Phone caption="4 · Answer, Build — the hero. Tap any block to mark it placed." time="9:43" battery={75}>
          <ScreenBuild />
        </Phone>
        <Phone caption="5 · Answer, Debug — Bahasa Malaysia interface, English block names, one invented block rejected in red." time="9:51" battery={71}>
          <ScreenDebug />
        </Phone>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
