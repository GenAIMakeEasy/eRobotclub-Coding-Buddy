<!--
================================================================================
BENCHMARK TRANSFER — case, verification, and what was carried across
================================================================================

CASE CHOSEN
  Kitchen Stories (AJNS New Media GmbH, Berlin) — iOS/watchOS/tvOS recipe app.

WHAT I VERIFIED (WebSearch, not memory)
  - Kitchen Stories is a genuine Apple Design Award winner, announced at WWDC
    2017. Apple's own newsroom release "Apple Design Awards celebrate innovation
    and creativity" (June 2017) lists it in the App Winners cohort alongside
    Lake, Bear, Things 3, Elk, Enlight and Airmail 3. It also took App Store
    Best-of placements in 2014 and 2015. Founded by Mengting Gao and Verena
    Hubertz; the app was cited by Apple for being written almost entirely in
    Swift and shipping a coherent experience across iPhone, iPad, Watch and TV.
  - Verified design facts (design writeups on DesignRush / bestdesigns.co /
    Mac O'Clock "Design details: Kitchen Stories"): modern lightweight
    typography, custom iconography, very large amounts of white space, an
    uncluttered near-white field, and a dedicated "cooking mode" entered from a
    Start Cooking button — a full-screen, step-at-a-time reading mode where the
    ingredients needed for THAT step are repeated inline so the cook never has
    to navigate back to the ingredient list.

WHY THIS CASE AND NOT A CODE EDITOR
  The core problem is identical, and it is not a code problem. A cook has flour
  on both hands, a noisy room, a phone propped at arm's length, and one
  question: "which step am I on, and what exactly do I do next?" An R Block
  student at a competition bench has a robot in one hand, a noisy hall, and the
  same question while transcribing blocks into the ROBOTIS R+ app. Kitchen
  Stories is the best-recognised solved answer to place-keeping under divided
  attention that I could actually verify.

WHAT WAS TRANSFERRED (mechanism, not surface)
  1. COOK MODE -> TRANSCRIBE MODE. The Build/Debug answer screen is not a
     document to read, it is a mode you are *inside*. A persistent header does
     what the cooking-mode step counter does: "4 / 10 placed", a hairline
     progress bar, and a single always-visible NEXT UP target. Kitchen Stories
     never makes you hunt for your place; neither does this.
  2. STEP-LOCAL INGREDIENTS -> INLINE SLOTS. Kitchen Stories repeats the
     ingredients for the current step inside that step so you never scroll back.
     Here every dropdown and typed value a block needs is rendered inside that
     block's own line as a distinct filled pill / boxed numeral. No legend, no
     lookup elsewhere.
  3. ONE ACTIVE STEP, EVERYTHING ELSE QUIET. Done lines recede to a pale
     completed state; the current line carries an accent ring and a raised
     card. Kitchen Stories' airy near-white field is reproduced so that the
     block path is the only thing with weight on the screen.
  4. LIGHTWEIGHT TYPOGRAPHY, HEAVY WHITESPACE, MINIMAL CHROME. Large thin
     display numerals for step numbers, generous line height, hairline rules
     instead of boxes.
  5. THE FORK. Kitchen Stories' Start Cooking button is one unmissable
     commitment target. The entry screen's Build/Debug fork is built the same
     way: two full-bleed committing targets, not a menu.

  NOT transferred: the photography. Kitchen Stories leans on food imagery to
  carry all the colour and emotion. The brief forbids imagery, so that role had
  to be reassigned — see the colour note below.

THE VERTICAL WALKED PATH
  Kitchen Stories' place-keeping answer is linear (swipe, one step at a time).
  R Block is *nested*, so a pure one-at-a-time carousel would destroy the shape
  of the program. The transfer keeps the mechanism (position is always visible,
  the current step is unmistakable) but re-forms it as a continuous vertical
  spine that indents with scope. The spine is filled with accent behind you and
  hairline ahead of you — a trail you have walked down, with nesting legible as
  the trail stepping right and back.
================================================================================
-->

<style>
  /* ==========================================================================
     COLOUR DERIVATION — sampled from Kitchen Stories' LOGIC, not its swatches
     --------------------------------------------------------------------------
     Kitchen Stories' colour logic is: the interface is deliberately colourless
     — a near-white, faintly warm paper field with black type — so that the ONE
     colourful thing on screen (the food photograph) is unambiguously the
     content. Colour is a pointer, not decoration.

     I keep the logic and reassign the pointer. There is no photograph here, so
     the thing that must own the colour is the student's POSITION ON THE PATH.
     Hence: the entire surface is a low-chroma warm paper field, and saturated
     colour appears in exactly one place — the walked spine, the progress bar,
     and the next-up ring.

     Accent hue: I did not copy Kitchen Stories' appetite-warm red. I re-derived
     from this content. Two constraints pushed the hue: (a) the ROBOTIS R+ Ollo
     kit the students actually hold is red-and-white, so a warm hue is the
     honest environmental match; (b) the screen is read at arm's length in a bad
     competition hall, and blue/green accents lose to overhead fluorescent
     glare, while amber holds luminance separation from paper. So the accent is
     an ember amber, oklch(0.64 0.155 52) — rotated ~20 degrees warmer/yellower
     than a pure red so that it CANNOT be confused with the validation red,
     which has to stay unambiguous in the Debug screen.

     Danger red is oklch(0.53 0.21 25): darker and much more chromatic than the
     accent, so "invalid block" never reads as "your current step".

     Large fields are all chroma <= 0.012. Category chips are hue-coded but
     capped at chroma 0.10 so eight of them can sit in one list without the
     page turning into confetti.
     ========================================================================== */
  :root {
    --paper:        oklch(0.968 0.006 78);
    --paper-deep:   oklch(0.925 0.010 76);
    --card:         oklch(0.995 0.002 90);
    --app-bg:       oklch(0.985 0.004 84);
    --ink:          oklch(0.245 0.015 60);
    --ink-mid:      oklch(0.455 0.014 60);
    --ink-soft:     oklch(0.615 0.012 62);
    --ink-faint:    oklch(0.755 0.010 65);
    --hair:         oklch(0.905 0.007 70);
    --hair-soft:    oklch(0.945 0.005 74);

    --accent:       oklch(0.640 0.155 52);
    --accent-deep:  oklch(0.470 0.135 48);
    --accent-wash:  oklch(0.960 0.028 62);
    --accent-edge:  oklch(0.885 0.060 58);
    --on-accent:    oklch(0.255 0.075 48);

    --danger:       oklch(0.530 0.210 25);
    --danger-wash:  oklch(0.963 0.026 25);
    --danger-edge:  oklch(0.855 0.090 25);

    --done:         oklch(0.560 0.075 155);
    --done-wash:    oklch(0.965 0.020 155);
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 700px at 18% -8%, oklch(0.995 0.006 82) 0%, transparent 62%),
      radial-gradient(900px 600px at 92% 4%, oklch(0.975 0.016 58) 0%, transparent 58%),
      var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
  }
  .mono {
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", "Roboto Mono", Menlo, monospace;
  }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>

function CatChip({ cat }) {
  const c = CAT[cat] || { fg: C.danger, bg: C.dangerWash };
  return (
    <span style={{
      fontSize: 10, fontWeight: 700, letterSpacing: 0.7, textTransform: 'uppercase',
      color: c.fg, background: c.bg, padding: '2px 7px', borderRadius: 5,
      whiteSpace: 'nowrap', lineHeight: 1.5,
    }}>{cat}</span>
  );
}

/* Inline slots. Transfer note: this is Kitchen Stories' "ingredients repeated
   inside the step" — everything the block needs lives in the block's own line. */
function BlockText({ parts, dim, bad }) {
  return (
    <span style={{
      fontFamily: MONO, fontSize: 14, lineHeight: 1.62,
      color: bad ? C.danger : (dim ? C.inkSoft : C.ink),
      fontWeight: 500, letterSpacing: -0.1,
      display: 'inline', wordBreak: 'break-word',
    }}>
      {parts.map((seg, k) => {
        const [kind, val] = seg;
        if (kind === 't') return <span key={k}>{val}{' '}</span>;
        if (kind === 'd') return (
          <span key={k} style={{
            display: 'inline-block', margin: '0 3px 0 0',
            background: dim ? 'oklch(0.955 0.004 80)' : 'oklch(0.925 0.012 250)',
            color: dim ? C.inkSoft : 'oklch(0.320 0.090 250)',
            padding: '1px 6px 1px 7px', borderRadius: 999,
            fontSize: 13.5, fontWeight: 600, whiteSpace: 'nowrap',
          }}>{val}<span style={{ fontSize: 9, opacity: 0.65, marginLeft: 4 }}>▾</span></span>
        );
        return (
          <span key={k} style={{
            display: 'inline-block', margin: '0 3px 0 0',
            background: dim ? 'transparent' : C.card,
            border: `1.5px solid ${dim ? C.hairSoft : 'oklch(0.800 0.050 78)'}`,
            color: dim ? C.inkSoft : 'oklch(0.380 0.075 70)',
            padding: '0px 6px', borderRadius: 4,
            fontSize: 13.5, fontWeight: 700, whiteSpace: 'nowrap',
          }}>{val}</span>
        );
      })}
    </span>
  );
}

/* ---------------------------------------------------------------------------

  const t = T[lang];
  return (
    <div style={{ padding: '0 14px 8px 14px' }}>
      {program.map((b, idx) => {
        const isDone = done.has(idx);
        const isNext = idx === nextIdx;
        const pad = b.i * 20;
        const bad = !!b.bad;
        return (
          <div key={idx} style={{ display: 'flex', alignItems: 'stretch', paddingLeft: pad }}>

            {/* the spine + node */}
            <div style={{ width: 26, position: 'relative', flexShrink: 0 }}>
              <div style={{
                position: 'absolute', left: 12, top: 0, bottom: 0, width: 2,
                background: isDone ? C.accent : C.hair,
              }} />
              {idx === 0 && <div style={{ position: 'absolute', left: 12, top: 0, height: 14, width: 2, background: C.card }} />}
              {idx === program.length - 1 && <div style={{ position: 'absolute', left: 12, bottom: 0, height: 'calc(100% - 26px)', width: 2, background: C.card }} />}
              <div style={{
                position: 'absolute', left: 4, top: 8, width: 18, height: 18,
                borderRadius: 999, zIndex: 2,
                background: bad ? C.dangerWash : (isDone ? C.accent : C.card),
                border: `2px solid ${bad ? C.danger : (isDone ? C.accent : (isNext ? C.accent : C.hair))}`,
                boxShadow: isNext && !isDone ? `0 0 0 4px ${C.accentWash}` : 'none',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }}>
                {isDone && !bad && (
                  <svg width="10" height="10" viewBox="0 0 10 10">
                    <path d="M1.6 5.2 L3.9 7.4 L8.4 2.6" stroke="#fff" strokeWidth="1.9" fill="none" strokeLinecap="round" strokeLinejoin="round" />
                  </svg>
                )}
                {bad && <span style={{ fontSize: 11, fontWeight: 800, color: C.danger, lineHeight: 1 }}>!</span>}
              </div>
            </div>

            {/* the line card */}
            <div
              onClick={() => !bad && toggle(idx)}
              data-blockline={idx}
              style={{
                flex: 1, minWidth: 0, cursor: bad ? 'default' : 'pointer',
                margin: '3px 0 3px 4px', padding: '6px 10px 7px 10px',
                borderRadius: 11,
                background: bad ? C.dangerWash : (isDone ? 'oklch(0.975 0.004 80)' : C.card),
                border: `1px solid ${bad ? C.dangerEdge : (isNext && !isDone ? C.accentEdge : C.hairSoft)}`,
                boxShadow: isNext && !isDone && !bad ? '0 3px 12px oklch(0.640 0.155 52 / 0.13)' : 'none',
                userSelect: 'none',
              }}
            >
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 3 }}>
                {bad
                  ? <span style={{
                      fontSize: 10, fontWeight: 800, letterSpacing: 0.7, textTransform: 'uppercase',
                      color: C.danger, background: 'oklch(0.930 0.045 25)', padding: '2px 7px', borderRadius: 5,
                    }}>Not a real block</span>
                  : <CatChip cat={b.cat} />}
                <span style={{ flex: 1 }} />
                {isNext && !isDone && !bad && (
                  <span style={{
                    fontSize: 9.5, fontWeight: 800, letterSpacing: 0.8, textTransform: 'uppercase',
                    color: C.accentDeep,
                  }}>{t.nextUp}</span>
                )}
                <span style={{
                  fontSize: 11, fontWeight: 700, fontVariantNumeric: 'tabular-nums',
                  color: isDone ? C.accentDeep : C.inkFaint,
                }}>{String(idx + 1).padStart(2, '0')}</span>
              </div>
              <BlockText parts={b.p} dim={isDone} bad={bad} />
              {bad && (
                <div style={{ marginTop: 8, paddingTop: 8, borderTop: `1px solid ${C.dangerEdge}` }}>
                  <div style={{ fontSize: 12, color: 'oklch(0.400 0.100 25)', lineHeight: 1.45 }}>{b.why}</div>
                  <div style={{ fontFamily: MONO, fontSize: 13, color: C.ink, marginTop: 5, fontWeight: 600 }}>{b.fix}</div>
                </div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ============================================================================
   SCREEN 4 — Answer, Build. The block path is the hero.
   ========================================================================== */
function ScreenBuild() {
  const [lang, setLang] = useState('en');
  const [done, setDone] = useState(new Set([0, 1, 2]));
  const t = T[lang];
  const toggle = (i) => setDone(prev => {
    const n = new Set(prev);
    n.has(i) ? n.delete(i) : n.add(i);
    return n;
  });
  const nextIdx = useMemo(() => {
    for (let i = 0; i < BUILD_PROGRAM.length; i++) if (!done.has(i)) return i;
    return -1;
  }, [done]);

  const summary = {
    en: 'Read the left IR sensor inside a loop. While it sees the dark line, drive forward; when it loses the line, nudge one wheel back until it finds it again.',
    ms: 'Baca sensor IR kiri di dalam gelung. Selagi ia nampak garisan gelap, gerak ke hadapan; bila hilang garisan, undurkan satu roda sehingga jumpa semula.',
    zh: '在循环里读取左侧红外传感器。看到黑线就前进；丢线时让一侧轮子后退，直到重新找到线。',
  }[lang];
  const note = {
    en: 'Raise Speed slowly — above 60 the sensor misses the line on tight curves.',
    ms: 'Naikkan Speed perlahan-lahan — melebihi 60 sensor akan terlepas garisan di selekoh tajam.',
    zh: 'Speed 要慢慢加 —— 超过 60 时急弯处传感器会丢线。',
  }[lang];

  return (
    <div style={{ background: C.card, minHeight: '100%' }}>
      <div style={{
        padding: '11px 16px', background: C.card,
        display: 'flex', alignItems: 'center', gap: 10,
      }}>
        <span style={{
          fontSize: 11, fontWeight: 800, letterSpacing: 0.8, textTransform: 'uppercase',
          color: C.accentDeep, background: C.accentWash, padding: '3px 9px', borderRadius: 6,
        }}>{t.build}</span>
        <span style={{ flex: 1 }} />
        <div style={{ display: 'flex', gap: 4 }}>
          {['en', 'ms', 'zh'].map(k => (
            <button key={k} data-lang={k} onClick={() => setLang(k)} style={{
              padding: '4px 9px', borderRadius: 7, cursor: 'pointer', fontFamily: 'inherit',
              border: `1px solid ${k === lang ? C.accent : C.hair}`,
              background: k === lang ? C.accentWash : 'transparent',
              color: k === lang ? C.accentDeep : C.inkSoft,
              fontSize: 12, fontWeight: k === lang ? 700 : 500,
            }}>{T[k].code}</button>
          ))}
        </div>
      </div>

      <div style={{ padding: '0 16px 4px 16px' }}>
        <div style={{ fontSize: 11.5, fontWeight: 700, letterSpacing: 1.1, textTransform: 'uppercase', color: C.inkSoft, marginBottom: 4 }}>{t.summary}</div>
        <div style={{ fontSize: 14.5, lineHeight: 1.45, color: C.ink, fontWeight: 400 }}>{summary}</div>
      </div>

      <div style={{ height: 10 }} />
      <ProgressHeader label={t.program} doneCount={done.size} total={BUILD_PROGRAM.length} lang={lang} hint={t.tapHint} />
      <div style={{ height: 6 }} />

      <BlockPath program={BUILD_PROGRAM} done={done} toggle={toggle} nextIdx={nextIdx} lang={lang} />

      <div style={{ padding: '4px 16px 26px 16px' }}>
        {nextIdx === -1 && (
          <div style={{
            background: C.doneWash, border: `1px solid oklch(0.870 0.045 155)`, borderRadius: 12,
            padding: '11px 13px', fontSize: 14, fontWeight: 650, color: C.done, marginBottom: 12,
          }}>✓ {t.allDone}</div>
        )}
        <div style={{ display: 'flex', gap: 8, alignItems: 'flex-start', marginTop: 4 }}>
          <div style={{ fontSize: 11, fontWeight: 800, letterSpacing: 0.9, textTransform: 'uppercase', color: C.inkFaint, marginTop: 2, flexShrink: 0 }}>{t.note}</div>
          <div style={{ fontSize: 13.5, color: C.inkMid, lineHeight: 1.5 }}>{note}</div>
        </div>
        <div style={{
          marginTop: 14, display: 'flex', gap: 8, alignItems: 'center',
          borderTop: `1px solid ${C.hairSoft}`, paddingTop: 12,
        }}>
          <div style={{ fontFamily: MONO, fontSize: 11, fontWeight: 700, color: C.inkMid, border: `1px solid ${C.hair}`, borderRadius: 4, padding: '1px 5px' }}>EN</div>
          <div style={{ fontSize: 12, color: C.inkFaint, lineHeight: 1.4 }}>{t.engNote}</div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================================
   SCREEN 5 — Answer, Debug. Bahasa Malaysia interface, English block names.
   Includes the "what was wrong" region and the red invalid-block state.
   ========================================================================== */
function ScreenDebug() {
  const [lang, setLang] = useState('ms');
  const [done, setDone] = useState(new Set([0, 1]));
  const t = T[lang];
  const toggle = (i) => setDone(prev => {
    const n = new Set(prev);
    n.has(i) ? n.delete(i) : n.add(i);
    return n;
  });
  const nextIdx = useMemo(() => {
    for (let i = 0; i < DEBUG_PROGRAM.length; i++) {
      if (DEBUG_PROGRAM[i].bad) continue;
      if (!done.has(i)) return i;
    }
    return -1;
  }, [done]);
  const total = DEBUG_PROGRAM.filter(b => !b.bad).length;

  const wrong = {
    en: 'Your loop reads the IR sensor once before it starts, so the value never updates. The robot keeps driving on a stale reading and rolls past the line.',
    ms: 'Gelung anda membaca sensor IR sekali sahaja sebelum bermula, jadi nilainya tidak dikemas kini. Robot terus bergerak dengan bacaan lama dan terlepas garisan.',
    zh: '你的循环在开始前只读了一次红外传感器，数值之后不再更新。机器人一直用旧读数行驶，于是冲过了黑线。',
  }[lang];
  const summary = {
    en: 'Move the sensor test inside the Repeat block so it is re-read on every pass.',
    ms: 'Pindahkan ujian sensor ke dalam blok Repeat supaya ia dibaca semula pada setiap pusingan.',
    zh: '把传感器判断移到 Repeat 里面，让它每一轮都重新读取。',
  }[lang];

  return (
    <div style={{ background: C.card, minHeight: '100%' }}>
      <div style={{ padding: '11px 16px', display: 'flex', alignItems: 'center', gap: 10 }}>
        <span style={{
          fontSize: 11, fontWeight: 800, letterSpacing: 0.8, textTransform: 'uppercase',
          color: C.danger, background: C.dangerWash, padding: '3px 9px', borderRadius: 6,
        }}>{t.debug}</span>
        <span style={{ flex: 1 }} />
        <div style={{ display: 'flex', gap: 4 }}>
          {['en', 'ms', 'zh'].map(k => (
            <button key={k} data-lang={k} onClick={() => setLang(k)} style={{
              padding: '4px 9px', borderRadius: 7, cursor: 'pointer', fontFamily: 'inherit',
              border: `1px solid ${k === lang ? C.accent : C.hair}`,
              background: k === lang ? C.accentWash : 'transparent',
              color: k === lang ? C.accentDeep : C.inkSoft,
              fontSize: 12, fontWeight: k === lang ? 700 : 500,
            }}>{T[k].code}</button>
          ))}
        </div>
      </div>

      {/* what was wrong */}
      <div style={{ padding: '0 16px' }}>
        <div style={{
          background: C.dangerWash, border: `1px solid ${C.dangerEdge}`, borderRadius: 14,
          padding: '11px 13px',
        }}>
          <div style={{ fontSize: 11.5, fontWeight: 800, letterSpacing: 1, textTransform: 'uppercase', color: C.danger, marginBottom: 4 }}>{t.wrong}</div>
          <div style={{ fontSize: 14, lineHeight: 1.45, color: 'oklch(0.330 0.075 30)' }}>{wrong}</div>
          <div style={{ height: 1, background: C.dangerEdge, margin: '9px -13px 8px -13px' }} />
          <div style={{ fontSize: 14, lineHeight: 1.45, color: C.ink, fontWeight: 600 }}>{summary}</div>
        </div>
      </div>

      <div style={{ height: 10 }} />
      <ProgressHeader label={t.program} doneCount={done.size} total={total} lang={lang} hint={t.tapHint} />
      <div style={{ height: 6 }} />

      <BlockPath program={DEBUG_PROGRAM} done={done} toggle={toggle} nextIdx={nextIdx} lang={lang} />

      <div style={{ padding: '4px 16px 26px 16px' }}>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center', borderTop: `1px solid ${C.hairSoft}`, paddingTop: 12 }}>
          <div style={{ fontFamily: MONO, fontSize: 11, fontWeight: 700, color: C.inkMid, border: `1px solid ${C.hair}`, borderRadius: 4, padding: '1px 5px' }}>EN</div>
          <div style={{ fontSize: 12, color: C.inkFaint, lineHeight: 1.4 }}>{t.engNote}</div>
        </div>
      </div>
    </div>
  );
}

/* ============================================================================
   Presentation surface
   ========================================================================== */
function Phone({ caption, children, battery = 78, time = '9:41' }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
      <div style={{
        fontStyle: 'italic', fontSize: 14.5, color: 'oklch(0.420 0.020 62)',
        marginBottom: 12, textAlign: 'center', maxWidth: 380, lineHeight: 1.4,
      }}>{caption}</div>
      <IosFrame time={time} battery={battery}>{children}</IosFrame>
    </div>
  );
}

function App() {
  return (
    <div style={{ padding: '46px 40px 70px 40px' }}>
      <div style={{ maxWidth: 1500, margin: '0 auto 40px auto' }}>
        <div style={{
          fontSize: 11.5, fontWeight: 800, letterSpacing: 2.4, textTransform: 'uppercase',
          color: 'oklch(0.470 0.135 48)',
        }}>Benchmark transfer · Kitchen Stories (Apple Design Award 2017)</div>
        <div style={{
          fontSize: 42, fontWeight: 250, letterSpacing: -1.4, marginTop: 10,
          color: 'oklch(0.245 0.015 60)', lineHeight: 1.1,
        }}>R Block Coding Buddy</div>
        <div style={{
          fontSize: 16, color: 'oklch(0.455 0.014 60)', marginTop: 12,
          maxWidth: 720, lineHeight: 1.55,
        }}>
          Kitchen Stories solved place-keeping for someone whose hands are busy: a cooking mode
          with a step counter that never scrolls away, and every ingredient repeated inside the step
          that needs it. Transferred here, that becomes a <strong style={{ fontWeight: 650 }}>transcribe mode</strong> — a
          vertical spine that fills in behind you as you place each R Block, indenting sideways to show nesting,
          with every dropdown and typed value living inside its own block line.
        </div>
        <div style={{ height: 1, background: 'oklch(0.885 0.010 74)', marginTop: 30 }} />
      </div>

      <div style={{
        display: 'flex', flexWrap: 'wrap', gap: 44, justifyContent: 'center',
        maxWidth: 1520, margin: '0 auto',
      }}>
        <Phone caption="1 · Entry — the fork, not a menu. Tap Build/Debug, tap a language." time="9:41" battery={78}>
          <ScreenEntry />
        </Phone>
        <Phone caption="2 · Ask — shown in the photo-attached state. Tap Remove to see the empty state." time="9:42" battery={77}>
          <ScreenAsk />
        </Phone>
        <Phone caption="3 · Working — queue position and an honest range, in 中文. Tap a stage." time="9:42" battery={77}>
          <ScreenQueue />
        </Phone>
        <Phone caption="4 · Answer, Build — the hero. Tap any line to mark it placed." time="9:43" battery={75}>
          <ScreenBuild />
        </Phone>
        <Phone caption="5 · Answer, Debug — Bahasa Malaysia interface, English block names, one block rejected in red." time="9:51" battery={71}>
          <ScreenDebug />
        </Phone>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
