<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>R Block Coding Buddy — Cinematic Sound-Viz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /*
    ACCENT DERIVATION — read this before judging the palette.

    The colour is not chosen for mood. It is chosen from the machine.
    The ROBOTIS Ollo's primary sense of the world is its IR sensor: it emits
    infrared and reads the bounce. Infrared is light one step past the red end
    of what a human eye can see — the robot's signal is literally an invisible
    amber. So the one accent in this design is that beam made visible:

      --sig-a : oklch(0.82 0.155 68)   warm amber   (the emitted beam)
      --sig-b : oklch(0.90 0.135 96)   pale gold    (the returned, weaker echo)

    Every gradient in the file runs a -> b: emitted to received. That is the
    only gradient, and it only ever describes signal — never chrome, never a
    button that isn't about the program's own path.

    Why not the obvious cyan: cyan-on-black is the SaaS default and it is a cold
    colour. This app is used by ten-year-olds in a loud hall. Amber is the
    colour of warm light — it reads as a lamp, not a warning terminal. It also
    clears 4.5:1 on pure black by a wide margin (amber #F2A64B on #000 ~ 9.9:1),
    where a saturated cyan would not at small sizes.

    Red is reserved. It appears exactly once in the whole product: a block name
    that failed validation. Because it is the only red anywhere, it cannot be
    misread as decoration.
  */
  :root {
    --sig-a: oklch(0.82 0.155 68);
    --sig-b: oklch(0.90 0.135 96);
    --sig-grad: linear-gradient(90deg, oklch(0.82 0.155 68), oklch(0.90 0.135 96));
    --ink:     oklch(1 0 0);
    --ink-2:   oklch(0.86 0 0);   /* ~ 11:1 on black */
    --ink-3:   oklch(0.72 0 0);   /* ~ 6.5:1 on black — floor for labels */
    --line:    oklch(0.32 0 0);
    --line-2:  oklch(0.22 0 0);
    --bad:     oklch(0.68 0.19 25);
    --field:   oklch(0.16 0 0);
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #050505;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    color: var(--ink);
  }
  /* presentation surface: a single faint trace running behind the phones */
  .surface {
    min-height: 100vh;
    padding: 44px 40px 72px;
    background:
      radial-gradient(1200px 520px at 18% -6%, oklch(0.24 0.05 70 / 0.5), transparent 70%),
      radial-gradient(900px 480px at 92% 108%, oklch(0.20 0.03 96 / 0.42), transparent 72%),
      #050505;
  }
  button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; padding: 0; }
  ::-webkit-scrollbar { width: 0; height: 0; }

  @keyframes sweep     { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
  @keyframes pulseHead { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  @keyframes breathe   { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
  @keyframes eq        { 0%,100% { transform: scaleY(0.35); } 50% { transform: scaleY(1); } }
  @keyframes dash      { to { stroke-dashoffset: -240; } }
</style>
</head>
<body>
<div id="root"></div>

/* ============================================================
   Block data — real R Block phrasing. Slots marked with {}.
   depth = nesting = AMPLITUDE of the signal.
   ============================================================ */

const CAT_TONE = {
  Control:     0.00,
  Motion:      0.34,
  Sensing:     0.62,
  Variable:    0.82,
  Calculation: 0.94,
  Function:    0.5,
  Screen:      0.2,
  Sound:       0.7,
};

/* ============================================================
   Shared primitives
   ============================================================ */
const mono = "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace";

function Kicker({ children, style }) {
  return (
    <div style={{
      fontSize: 12, letterSpacing: '0.22em', textTransform: 'uppercase',
      color: 'var(--ink-3)', fontWeight: 600, ...style,
    }}>{children}</div>
  );
}

/* A trace: the one recurring graphic. Amplitude comes from real data. */
function Trace({ amps, w = 320, h = 44, lit = 1, animate = false, strokeW = 2 }) {
  const n = amps.length;
  const step = w / (n - 1 || 1);
  const pts = amps.map((a, i) => `${(i * step).toFixed(1)},${(h / 2 - (a * (h / 2 - 3))).toFixed(1)}`).join(' ');
  const id = useMemo(() => 'g' + Math.random().toString(36).slice(2, 8), []);
  return (
    <svg width={w} height={h} viewBox={`0 0 ${w} ${h}`} style={{ display: 'block', overflow: 'visible' }}>
      <defs>
        <linearGradient id={id} x1="0" x2="1">
          <stop offset="0%" stopColor="oklch(0.82 0.155 68)" />
          <stop offset="100%" stopColor="oklch(0.90 0.135 96)" />
        </linearGradient>
      </defs>
      <polyline points={pts} fill="none" stroke={`url(#${id})`} strokeWidth={strokeW}
        strokeLinejoin="round" strokeLinecap="round" opacity={lit}
        strokeDasharray={animate ? '10 6' : undefined}
        style={animate ? { animation: 'dash 3.2s linear infinite' } : undefined} />
    </svg>
  );
}

/* Bars whose heights are the program's own nesting depth. */
function ProgramSpectrum({ rows, doneSet, onBar, height = 46 }) {
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', gap: 3, height }}>
      {rows.map((r, i) => {
        const on = doneSet.has(i);
        const hh = 10 + r.d * 14;
        return (
          <button key={i} onClick={() => onBar && onBar(i)} title={r.t}
            style={{
              flex: 1, height: hh, borderRadius: 1,
              background: r.bad ? 'var(--bad)' : (on ? 'var(--sig-grad)' : 'oklch(0.34 0 0)'),
              transition: 'background 180ms, height 180ms',
            }} />
        );
      })}
    </div>
  );
}

function LangPills({ lang, setLang, size = 'md' }) {
  const pad = size === 'sm' ? '6px 11px' : '9px 15px';
  const fs = size === 'sm' ? 12 : 14;
  return (
    <div style={{ display: 'flex', gap: 6 }}>
      {LANGS.map(l => {
        const on = l.id === lang;
        return (
          <button key={l.id} onClick={() => setLang(l.id)} style={{
            padding: pad, fontSize: fs, fontWeight: on ? 700 : 500,
            letterSpacing: '0.04em',
            color: on ? '#000' : 'var(--ink-2)',
            background: on ? 'var(--sig-grad)' : 'transparent',
            border: `1px solid ${on ? 'transparent' : 'var(--line)'}`,
            borderRadius: 999, transition: 'all 160ms',
          }}>{l.short}</button>
        );
      })}
    </div>
  );
}

/* Renders `text {slot}` with slots visually distinct from fixed block text. */
function BlockText({ t, dim }) {
  const parts = t.split(/(\{[^}]*\})/g).filter(Boolean);
  return (
    <span style={{ fontFamily: mono, fontSize: 14.5, lineHeight: 1.55, letterSpacing: '-0.01em' }}>
      {parts.map((p, i) => {
        if (p.startsWith('{')) {
          const v = p.slice(1, -1);
          const numeric = /^[\d.]+$/.test(v);
          return (
            <span key={i} style={{
              display: 'inline-block',
              padding: '1px 7px', margin: '0 1px',
              borderRadius: numeric ? 3 : 999,
              fontWeight: 600,
              color: dim ? 'oklch(0.78 0.09 80)' : '#000',
              background: dim ? 'transparent' : 'var(--sig-grad)',
              border: dim ? '1px solid oklch(0.5 0.09 80)' : '1px solid transparent',
            }}>{v}</span>
          );
        }
        return <span key={i} style={{ color: dim ? 'var(--ink-2)' : 'var(--ink)' }}>{p}</span>;
      })}
    </span>
  );
}

/* ------------------------------------------------------------
   THE SPINE. This is the fusion.
   The gutter carries one continuous trace. Indentation moves the
   trace right and its node sits on it, so nesting is amplitude.
   Everything above the read-head is lit signal; below it, dark.
   ------------------------------------------------------------ */
function BlockLine({ row, prev, i, done, isHead, onTap, lang }) {
  const X = d => 11 + d * 15;
  const x = X(row.d);
  const px = prev ? X(prev.d) : x;
  const lit = done;
  const stroke = lit ? 'oklch(0.86 0.145 82)' : 'oklch(0.30 0 0)';

  return (
    <button onClick={onTap} style={{
      display: 'flex', width: '100%', textAlign: 'left',
      alignItems: 'stretch', position: 'relative',
      background: isHead ? 'oklch(0.20 0.045 72 / 0.5)' : 'transparent',
      transition: 'background 160ms',
    }}>
      {/* gutter — the running trace */}
      <div style={{ position: 'relative', width: 58, flex: '0 0 58px' }}>
        {/* vertical run */}
        <div style={{
          position: 'absolute', left: x, top: 0, bottom: 0, width: 2,
          background: stroke, transition: 'background 200ms',
        }} />
        {/* elbow into this depth */}
        {prev && prev.d !== row.d && (
          <div style={{
            position: 'absolute', top: 0, height: 2,
            left: Math.min(x, px), width: Math.abs(x - px) + 2,
            background: stroke, transition: 'background 200ms',
          }} />
        )}
        {prev && prev.d !== row.d && (
          <div style={{
            position: 'absolute', left: px, top: 0, bottom: 'calc(100% - 2px)', width: 2,
            background: stroke,
          }} />
        )}
        {/* node */}
        <div style={{
          position: 'absolute', left: x - 4, top: 16, width: 10, height: 10,
          borderRadius: 2,
          background: row.bad ? 'var(--bad)' : (lit ? 'var(--sig-grad)' : '#000'),
          border: `2px solid ${row.bad ? 'var(--bad)' : stroke}`,
          transition: 'all 200ms',
        }} />
        {/* read-head marker */}
        {isHead && (
          <div style={{
            position: 'absolute', left: x + 10, top: 19, width: 16, height: 2,
            background: 'var(--sig-a)', animation: 'pulseHead 1.4s ease-in-out infinite',
          }} />
        )}
      </div>

      {/* payload */}
      <div style={{
        flex: 1, padding: '9px 16px 10px 0',
        borderTop: i === 0 ? 'none' : '1px solid oklch(0.17 0 0)',
        opacity: done ? 0.55 : 1, transition: 'opacity 200ms',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
          <span style={{
            fontSize: 12, fontWeight: 700, letterSpacing: '0.14em',
            textTransform: 'uppercase',
            color: row.bad ? 'var(--bad)' : `oklch(${0.68 + CAT_TONE[row.cat] * 0.12} 0 0)`,
          }}>{row.cat}</span>
          <span style={{
            flex: 1, height: 1,
            background: 'repeating-linear-gradient(90deg, oklch(0.28 0 0) 0 3px, transparent 3px 6px)',
          }} />
          <span style={{ fontSize: 12, fontFamily: mono, color: 'var(--ink-3)' }}>
            {String(i + 1).padStart(2, '0')}
          </span>
          {done && <span style={{ fontSize: 12, color: 'var(--sig-a)', fontWeight: 700 }}>✓</span>}
        </div>

        {row.bad ? (
          <div style={{ border: '1.5px solid var(--bad)', borderRadius: 8, padding: '8px 10px', background: 'oklch(0.24 0.07 25 / 0.45)' }}>
            <BlockText t={row.t} dim />
            <div style={{ fontSize: 13, color: 'oklch(0.84 0.09 25)', marginTop: 6, lineHeight: 1.45 }}>
              {lang === 'ms' ? row.badMs : lang === 'zh' ? row.badZh : row.badEn}
            </div>
          </div>
        ) : (
          <BlockText t={row.t} />
        )}
      </div>
    </button>
  );
}

function BlockProgram({ rows, done, toggle, lang, t }) {
  const doneSet = done;
  const head = rows.findIndex((r, i) => !doneSet.has(i));
  const count = doneSet.size;
  return (
    <div>
      {/* the program as one signal — bar height IS nesting depth */}
      <div style={{ padding: '0 20px 14px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 9 }}>
          <Kicker>{t.blocks}</Kicker>
          <span style={{ fontFamily: mono, fontSize: 13, color: count === rows.length ? 'var(--sig-a)' : 'var(--ink-2)' }}>
            {count}/{rows.length} {t.placed}
          </span>
        </div>
        <ProgramSpectrum rows={rows} doneSet={doneSet} onBar={toggle} />
        <div style={{ height: 1, background: 'var(--line-2)', marginTop: 6 }} />
        <div style={{ fontSize: 12, color: 'var(--ink-3)', marginTop: 8, lineHeight: 1.45 }}>{t.tapHint}</div>
      </div>

      <div>
        {rows.map((r, i) => (
          <BlockLine key={i} row={r} prev={i > 0 ? rows[i - 1] : null} i={i}
            done={doneSet.has(i)} isHead={i === head} lang={lang}
            onTap={() => toggle(i)} />
        ))}
      </div>

      <div style={{
        margin: '4px 20px 0', padding: '10px 0 0',
        borderTop: '1px solid var(--line-2)',
        fontSize: 12, color: 'var(--ink-3)', lineHeight: 1.5,
      }}>{t.engNote}</div>
    </div>
  );
}

function ScreenHead({ label, title, lang, setLang }) {
  return (
    <div style={{ padding: '14px 20px 16px' }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
        <Kicker>{label}</Kicker>
        {setLang && <LangPills lang={lang} setLang={setLang} size="sm" />}
      </div>
      {title && (
        <div style={{ fontSize: 27, fontWeight: 600, letterSpacing: '-0.03em', marginTop: 10, lineHeight: 1.12 }}>
          {title}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   SCREEN 1 — Entry. The fork, drawn as one signal splitting.
   ============================================================ */
function S1() {
  const [lang, setLang] = useState('en');
  const [mode, setMode] = useState(null);
  const t = T[lang];

  const Card = ({ id, title, sub, amps }) => {
    const on = mode === id;
    return (
      <button onClick={() => setMode(on ? null : id)} style={{
        width: '100%', textAlign: 'left', padding: '26px 22px 22px',
        border: `1px solid ${on ? 'transparent' : 'var(--line)'}`,
        borderRadius: 18, position: 'relative', overflow: 'hidden',
        background: on ? 'oklch(0.22 0.055 72 / 0.85)' : 'oklch(0.11 0 0)',
        boxShadow: on ? '0 0 0 1.5px oklch(0.82 0.155 68)' : 'none',
        transition: 'all 200ms',
      }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 10 }}>
          <span style={{ fontSize: 42, fontWeight: 600, letterSpacing: '-0.04em' }}>{title}</span>
          {on && <span style={{ fontSize: 12, fontWeight: 700, letterSpacing: '0.16em', color: 'var(--sig-a)' }}>▶</span>}
        </div>
        <div style={{ fontSize: 16, color: 'var(--ink-2)', marginTop: 5 }}>{sub}</div>
        <div style={{ marginTop: 22, opacity: on ? 1 : 0.42, transition: 'opacity 200ms' }}>
          <Trace amps={amps} w={296} h={62} animate={on} />
        </div>
      </button>
    );
  };

  return (
    <div style={{ background: '#000', minHeight: '100%', color: 'var(--ink)', display: 'flex', flexDirection: 'column' }}>
      <div style={{ padding: '18px 20px 0' }}>
        <Kicker style={{ fontSize: 12 }}>{t.tag}</Kicker>
      </div>

      <div style={{ padding: '26px 20px 6px' }}>
        <div style={{ fontSize: 30, fontWeight: 600, letterSpacing: '-0.035em', lineHeight: 1.1 }}>{t.pick}</div>
      </div>

      <div style={{ padding: '14px 20px', display: 'flex', flexDirection: 'column', gap: 14 }}>
        <Card id="build" title={t.build} sub={t.buildSub}
          amps={[-0.15, 0.1, -0.05, 0.35, 0.15, 0.6, 0.35, 0.85, 0.6, 1, 0.8]} />
        <Card id="debug" title={t.debug} sub={t.debugSub}
          amps={[0.7, -0.6, 0.75, -0.5, 0.1, 0.1, 0.1, 0.1, -0.8, 0.9, -0.3]} />
      </div>

      <div style={{ flex: 1 }} />

      <div style={{ padding: '0 20px 22px' }}>
        <div style={{ height: 1, background: 'var(--line-2)', marginBottom: 16 }} />
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10 }}>
          <Kicker>{t.langLabel}</Kicker>
          <LangPills lang={lang} setLang={setLang} />
        </div>
        <div style={{ fontSize: 12, color: 'var(--ink-3)', marginTop: 10, lineHeight: 1.5 }}>{t.langNote}</div>
      </div>
    </div>
  );
}

/* ============================================================
   SCREEN 2 — Ask, with the attached-photo state.
   ============================================================ */
function S2() {
  const [lang, setLang] = useState('en');
  const [photo, setPhoto] = useState(true);
  const t = T[lang];
  const text = { en: 'My robot has to follow the black line and stop at the red square at the end.',
                 ms: 'Robot saya perlu ikut garisan hitam dan berhenti di petak merah di hujung.',
                 zh: '我的机器人要沿黑线走，走到终点的红色方块就停下来。' }[lang];

  return (
    <div style={{ background: '#000', minHeight: '100%', display: 'flex', flexDirection: 'column' }}>
      <ScreenHead label={`${t.ask} · ${t.build}`} title={t.askH} lang={lang} setLang={setLang} />

      <div style={{ padding: '0 20px' }}>
        <div style={{
          border: '1px solid var(--line)', borderRadius: 14, padding: 15,
          background: 'var(--field)', minHeight: 128,
        }}>
          <div style={{ fontSize: 15.5, lineHeight: 1.55, color: 'var(--ink)' }}>{text}</div>
          <span style={{
            display: 'inline-block', width: 2, height: 18, background: 'var(--sig-a)',
            verticalAlign: 'middle', animation: 'pulseHead 1.1s steps(2) infinite',
          }} />
        </div>

        {/* input level meter — the question, as signal */}
        <div style={{ display: 'flex', alignItems: 'flex-end', gap: 2, height: 16, marginTop: 10 }}>
          {Array.from({ length: 44 }).map((_, i) => (
            <div key={i} style={{
              flex: 1, height: 4 + ((i * 7) % 12),
              background: i < 30 ? 'var(--sig-grad)' : 'oklch(0.28 0 0)',
              opacity: i < 30 ? 0.85 : 1,
            }} />
          ))}
        </div>
      </div>

      <div style={{ padding: '20px 20px 0' }}>
        <Kicker style={{ marginBottom: 10 }}>{photo ? t.attached : t.photo}</Kicker>

        {photo ? (
          <div style={{
            display: 'flex', gap: 13, alignItems: 'center',
            border: '1px solid oklch(0.45 0.09 75)', borderRadius: 14, padding: 11,
            background: 'oklch(0.15 0.02 75)',
          }}>
            {/* honest placeholder thumbnail — no stock imagery */}
            <div style={{
              width: 72, height: 72, borderRadius: 9, flex: '0 0 72px',
              background: 'repeating-linear-gradient(45deg, oklch(0.26 0 0) 0 7px, oklch(0.20 0 0) 7px 14px)',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              border: '1px solid var(--line)',
            }}>
              <span style={{ fontSize: 12, color: 'var(--ink-3)', fontFamily: mono }}>IMG</span>
            </div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 14.5, fontWeight: 600 }}>course-layout.jpg</div>
              <div style={{ fontSize: 13, color: 'var(--ink-3)', marginTop: 2 }}>1.8 MB · 3024×4032</div>
            </div>
            <button onClick={() => setPhoto(false)} style={{
              fontSize: 13, fontWeight: 600, color: 'var(--ink-2)',
              border: '1px solid var(--line)', borderRadius: 999, padding: '7px 13px',
            }}>{t.remove}</button>
          </div>
        ) : (
          <button onClick={() => setPhoto(true)} style={{
            width: '100%', display: 'flex', gap: 13, alignItems: 'center',
            border: '1px dashed var(--line)', borderRadius: 14, padding: 11, textAlign: 'left',
          }}>
            <div style={{
              width: 72, height: 72, borderRadius: 9, flex: '0 0 72px',
              border: '1px dashed var(--line)', display: 'flex',
              alignItems: 'center', justifyContent: 'center', fontSize: 26, color: 'var(--ink-3)',
            }}>+</div>
            <div>
              <div style={{ fontSize: 14.5, fontWeight: 600 }}>{t.photo}</div>
              <div style={{ fontSize: 13, color: 'var(--ink-3)', marginTop: 2 }}>{t.photoSub}</div>
            </div>
          </button>
        )}
      </div>

      <div style={{ flex: 1 }} />

      {/* what comes back — the answer contract, previewed as the signal it will be */}
      <div style={{ padding: '0 20px 20px' }}>
        <div style={{ height: 1, background: 'var(--line-2)', marginBottom: 16 }} />
        <Kicker style={{ marginBottom: 12 }}>
          {lang === 'zh' ? '你会收到' : lang === 'ms' ? 'Anda akan dapat' : 'You will get back'}
        </Kicker>
        {[
          [t.summary, lang === 'zh' ? '一两句话' : lang === 'ms' ? 'Satu atau dua ayat' : 'One or two sentences'],
          [t.blocks, lang === 'zh' ? '每行一块，可点掉' : lang === 'ms' ? 'Satu blok satu baris, boleh ditanda' : 'One per line, tap to tick off'],
          [t.note, lang === 'zh' ? '可能有一行提示' : lang === 'ms' ? 'Mungkin satu baris nota' : 'Maybe one line'],
        ].map(([a, b], i) => (
          <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 11, padding: '6px 0' }}>
            <span style={{ width: 8, height: 8, flex: '0 0 8px', borderRadius: 2,
              background: i === 1 ? 'var(--sig-grad)' : 'transparent',
              border: `2px solid ${i === 1 ? 'var(--sig-a)' : 'oklch(0.34 0 0)'}` }} />
            <span style={{ fontSize: 14.5, fontWeight: i === 1 ? 600 : 400,
              color: i === 1 ? 'var(--ink)' : 'var(--ink-2)' }}>{a}</span>
            <span style={{ fontSize: 13, color: 'var(--ink-3)' }}>· {b}</span>
          </div>
        ))}
      </div>

      <div style={{ padding: '0 20px 22px' }}>
        <button style={{
          width: '100%', padding: '17px 0', borderRadius: 14,
          background: 'var(--sig-grad)', color: '#000',
          fontSize: 17, fontWeight: 700, letterSpacing: '-0.01em',
        }}>{t.send}</button>
      </div>
    </div>
  );
}

/* ============================================================
   SCREEN 3 — Working / queue. Each person ahead is a trace.
   ============================================================ */
function S3() {
  const [lang, setLang] = useState('zh');
  const [stage, setStage] = useState(1);
  const t = T[lang];
  const pos = 3;

  return (
    <div style={{ background: '#000', minHeight: '100%', display: 'flex', flexDirection: 'column' }}>
      <ScreenHead label={t.working} lang={lang} setLang={setLang} />

      <div style={{ padding: '4px 20px 0' }}>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 10 }}>
          <span style={{ fontSize: 15, color: 'var(--ink-2)' }}>{t.queue}</span>
          <span style={{ fontSize: 62, fontWeight: 600, letterSpacing: '-0.05em', lineHeight: 1,
            background: 'var(--sig-grad)', WebkitBackgroundClip: 'text', backgroundClip: 'text',
            WebkitTextFillColor: 'transparent' }}>{pos}</span>
          <span style={{ fontSize: 15, color: 'var(--ink-2)' }}>{t.inQueue}</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginTop: 12 }}>
          <span style={{ fontSize: 13, color: 'var(--ink-3)' }}>{t.est}</span>
          <span style={{ fontFamily: mono, fontSize: 20, fontWeight: 500 }}>~24 {t.sec}</span>
        </div>
      </div>

      {/* the queue, drawn as stacked traces. Yours is lit. */}
      <div style={{ padding: '22px 20px 0' }}>
        {[0, 1, 2].map(i => {
          const mine = i === 2;
          return (
            <div key={i} style={{
              display: 'flex', alignItems: 'center', gap: 12,
              padding: '11px 0', borderBottom: '1px solid oklch(0.17 0 0)',
            }}>
              <span style={{ fontFamily: mono, fontSize: 13, color: mine ? 'var(--sig-a)' : 'var(--ink-3)', width: 20 }}>
                {i + 1}
              </span>
              <div style={{ flex: 1, opacity: mine ? 1 : 0.28 }}>
                <Trace w={220} h={26} strokeW={mine ? 2 : 1.4} animate={mine}
                  amps={[0.2, -0.4, 0.6, -0.2, 0.8, -0.5, 0.3, -0.7, 0.5, -0.1, 0.4]} />
              </div>
              <span style={{ fontSize: 12, color: mine ? 'var(--ink)' : 'var(--ink-3)', fontWeight: mine ? 700 : 400 }}>
                {mine ? (lang === 'zh' ? '你' : lang === 'ms' ? 'Anda' : 'You') : (lang === 'zh' ? '处理中' : lang === 'ms' ? 'Diproses' : 'Running')}
              </span>
            </div>
          );
        })}
      </div>

      {/* honest stage list — tap to advance, proves it is not a spinner */}
      <div style={{ padding: '20px 20px 0' }}>
        {t.stages.map((s, i) => {
          const state = i < stage ? 'done' : i === stage ? 'now' : 'todo';
          return (
            <button key={i} onClick={() => setStage(i === stage ? Math.min(i + 1, 3) : i)}
              style={{ display: 'flex', width: '100%', textAlign: 'left', alignItems: 'center', gap: 12, padding: '9px 0' }}>
              <span style={{
                width: 9, height: 9, borderRadius: 2, flex: '0 0 9px',
                background: state === 'todo' ? 'transparent' : 'var(--sig-grad)',
                border: `2px solid ${state === 'todo' ? 'oklch(0.34 0 0)' : 'var(--sig-a)'}`,
                animation: state === 'now' ? 'pulseHead 1.3s ease-in-out infinite' : 'none',
              }} />
              <span style={{
                fontSize: 15, flex: 1,
                color: state === 'todo' ? 'var(--ink-3)' : 'var(--ink)',
                fontWeight: state === 'now' ? 600 : 400,
              }}>{s}</span>
              {state === 'now' && (
                <span style={{ display: 'flex', gap: 2, alignItems: 'flex-end', height: 14 }}>
                  {[0, 1, 2, 3].map(k => (
                    <span key={k} style={{
                      width: 2.5, height: 14, background: 'var(--sig-a)', transformOrigin: 'bottom',
                      animation: `eq 0.9s ease-in-out ${k * 0.13}s infinite`,
                    }} />
                  ))}
                </span>
              )}
              {state === 'done' && <span style={{ fontSize: 12, color: 'var(--sig-a)' }}>✓</span>}
            </button>
          );
        })}
      </div>

      <div style={{ flex: 1 }} />
      <div style={{ padding: '0 20px 22px' }}>
        <div style={{ height: 1, background: 'var(--line-2)', marginBottom: 12 }} />
        <div style={{ fontSize: 13, color: 'var(--ink-3)', lineHeight: 1.5 }}>
          {lang === 'zh' ? '答案通常需要 10–30 秒。可以把手机放下，好了会亮起来。'
            : lang === 'ms' ? 'Jawapan biasanya mengambil 10–30 saat. Letakkan telefon anda — ia akan menyala apabila siap.'
            : 'Answers usually take 10–30 seconds. Put the phone down — it lights up when ready.'}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   SCREEN 4 — Answer, Build. The block list is the hero.
   ============================================================ */
function S4() {
  const [lang, setLang] = useState('en');
  const [done, setDone] = useState(() => new Set([0, 1, 2]));
  const t = T[lang];
  const toggle = i => setDone(prev => {
    const n = new Set(prev);
    n.has(i) ? n.delete(i) : n.add(i);
    return n;
  });

  return (
    <div style={{ background: '#000', minHeight: '100%', paddingBottom: 16 }}>
      <ScreenHead label={`${t.build} · ${t.summary}`} lang={lang} setLang={setLang} />
      <div style={{ padding: '0 20px 18px' }}>
        <div style={{ fontSize: 17, lineHeight: 1.5, color: 'var(--ink)', fontWeight: 400 }}>
          {lang === 'en' && 'Drive forward, and each time the left IR sensor sees the line, nudge right. Repeat four times, then stop.'}
          {lang === 'ms' && 'Bergerak ke hadapan; setiap kali sensor IR kiri nampak garisan, belok sedikit ke kanan. Ulang empat kali, kemudian berhenti.'}
          {lang === 'zh' && '向前走，每当左侧红外传感器看到黑线，就向右微调。重复四次，然后停下。'}
        </div>
      </div>

      <BlockProgram rows={BUILD_BLOCKS} done={done} toggle={toggle} lang={lang} t={t} />

      <div style={{ padding: '16px 20px 0' }}>
        <Kicker style={{ marginBottom: 7 }}>{t.note}</Kicker>
        <div style={{ fontSize: 14.5, color: 'var(--ink-2)', lineHeight: 1.5,
          borderLeft: '2px solid var(--sig-a)', paddingLeft: 12 }}>
          {lang === 'en' && 'If it drifts off the line, lower speed 500 to 350 first.'}
          {lang === 'ms' && 'Jika ia terkeluar dari garisan, turunkan kelajuan 500 kepada 350 dahulu.'}
          {lang === 'zh' && '如果它偏离黑线，先把速度 500 调到 350。'}
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   SCREEN 5 — Answer, Debug. BM interface, English blocks,
   plus the red validation-failure box.
   ============================================================ */
function S5() {
  const [lang, setLang] = useState('ms');
  const [done, setDone] = useState(() => new Set([0, 1]));
  const t = T[lang];
  const toggle = i => setDone(prev => {
    const n = new Set(prev);
    n.has(i) ? n.delete(i) : n.add(i);
    return n;
  });

  const wrong = {
    en: 'Your loop starts the wheels but never stops them, so the robot keeps driving into the wall.',
    ms: 'Gelung anda menghidupkan roda tetapi tidak pernah mematikannya, jadi robot terus melanggar dinding.',
    zh: '你的循环让轮子转起来却从不停下，所以机器人一直撞墙。',
  }[lang];

  return (
    <div style={{ background: '#000', minHeight: '100%', paddingBottom: 16 }}>
      <ScreenHead label={t.debug} lang={lang} setLang={setLang} />

      <div style={{ padding: '0 20px 18px' }}>
        <div style={{
          border: '1px solid var(--line)', borderRadius: 14, padding: '14px 15px',
          background: 'oklch(0.13 0 0)',
        }}>
          <div style={{ display: 'flex', gap: 10, alignItems: 'center', marginBottom: 9 }}>
            <Trace w={40} h={16} strokeW={2} amps={[0.9, -0.9, 0.2, 0.2, 0.2, -0.9]} />
            <Kicker style={{ fontSize: 12 }}>{t.wrong}</Kicker>
          </div>
          <div style={{ fontSize: 15.5, lineHeight: 1.55, color: 'var(--ink)' }}>{wrong}</div>
        </div>
      </div>

      <BlockProgram rows={DEBUG_BLOCKS} done={done} toggle={toggle} lang={lang} t={t} />
    </div>
  );
}

/* ============================================================
   Page
   ============================================================ */
function Phone({ caption, children, time }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 14 }}>
      <div style={{
        fontStyle: 'italic', fontSize: 14, color: 'var(--ink-3)',
        letterSpacing: '0.01em', textAlign: 'center', maxWidth: 380,
      }}>{caption}</div>
      <IosFrame darkMode time={time}>{children}</IosFrame>
    </div>
  );
}

function App() {
  return (
    <div className="surface">
      <div style={{ maxWidth: 1520, margin: '0 auto 40px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 18, flexWrap: 'wrap' }}>
          <div style={{ fontSize: 40, fontWeight: 600, letterSpacing: '-0.04em' }}>
            R Block Coding Buddy
          </div>
          <div style={{ flex: 1, minWidth: 120, opacity: 0.75 }}>
            <Trace w={420} h={30} amps={[0, 0.25, -0.15, 0.55, -0.3, 0.85, -0.5, 1, -0.65, 0.4, -0.2, 0.1, 0]} />
          </div>
        </div>
        <div style={{ fontSize: 15.5, color: 'var(--ink-2)', marginTop: 10, maxWidth: 760, lineHeight: 1.55 }}>
          A block program is a signal: it runs top to bottom, and every level of nesting is a rise in
          amplitude. The student transcribing it is a read-head moving down that signal — lit behind,
          dark ahead.
        </div>
      </div>

      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 40, justifyContent: 'center', alignItems: 'flex-start' }}>
        <Phone time="9:41" caption="1 · Entry — one signal forking into two. Tap Build or Debug; switch EN / BM / 中文.">
          <S1 />
        </Phone>
        <Phone time="9:41" caption="2 · Ask — the attached-photo state. Tap Remove to see the empty state.">
          <S2 />
        </Phone>
        <Phone time="9:42" caption="3 · Working — queue position as stacked traces. Tap a stage to advance it.">
          <S3 />
        </Phone>
        <Phone time="9:42" caption="4 · Answer, Build — the hero. Tap any line, or any bar, to mark it placed.">
          <S4 />
        </Phone>
        <Phone time="9:43" caption="5 · Answer, Debug — Bahasa Malaysia interface, English block names, one failed block in red.">
          <S5 />
        </Phone>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
